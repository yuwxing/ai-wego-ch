<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>黄果树瀑布 3D</title>
<style>
body { margin: 0; overflow: hidden; font-family: 'Microsoft YaHei', sans-serif; }
#info {
  position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
  color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,0.6);
  text-align: center; pointer-events: none; z-index: 10;
  background: rgba(0,0,0,0.3); padding: 10px 28px; border-radius: 12px;
  backdrop-filter: blur(6px);
}
#info h1 { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: 4px; }
#info p { margin: 4px 0 0; font-size: 13px; opacity: 0.8; }
#loading {
  position: fixed; inset: 0; z-index: 100;
  display: flex; align-items: center; justify-content: center;
  background: #1a2a1a; color: #8fbc8f;
  font-size: 18px; letter-spacing: 2px;
  transition: opacity 1s;
}
#loading.hidden { opacity: 0; pointer-events: none; }
#loading .spinner {
  width: 40px; height: 40px; border: 3px solid #2d4a2d;
  border-top-color: #8fbc8f; border-radius: 50%;
  animation: spin 1s linear infinite; margin-right: 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="loading"><div class="spinner"></div><span>生成黄果树瀑布...</span></div>
<div id="info"><h1>🌊 黄果树瀑布</h1><p>亚洲第一瀑 · 鼠标拖拽旋转 · 滚轮缩放</p></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// --- Scene Setup ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);
scene.fog = new THREE.Fog(0x87CEEB, 150, 350);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 500);
camera.position.set(60, 40, 90);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 20, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.maxPolarAngle = Math.PI / 2.1;
controls.minDistance = 20;
controls.maxDistance = 180;
controls.update();

// --- Lighting ---
const ambient = new THREE.AmbientLight(0x6688aa, 0.4);
scene.add(ambient);

const sun = new THREE.DirectionalLight(0xffeedd, 2.0);
sun.position.set(80, 100, 60);
sun.castShadow = true;
sun.shadow.mapSize.width = 2048;
sun.shadow.mapSize.height = 2048;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 200;
sun.shadow.camera.left = -80;
sun.shadow.camera.right = 80;
sun.shadow.camera.top = 80;
sun.shadow.camera.bottom = -80;
scene.add(sun);

const fill = new THREE.DirectionalLight(0x88bbff, 0.5);
fill.position.set(-40, 30, -60);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffffff, 0.3);
rim.position.set(-20, 60, -80);
scene.add(rim);

// --- Sky Gradient ---
const skyGeo = new THREE.SphereGeometry(300, 32, 32);
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  uniforms: {
    topColor: { value: new THREE.Color(0x4488cc) },
    bottomColor: { value: new THREE.Color(0xb8e0f7) },
    offset: { value: 20 },
    exponent: { value: 0.4 }
  },
  vertexShader: `
    varying vec3 vWorldPosition;
    void main() {
      vec4 worldPosition = modelMatrix * vec4(position, 1.0);
      vWorldPosition = worldPosition.xyz;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform vec3 topColor;
    uniform vec3 bottomColor;
    uniform float offset;
    uniform float exponent;
    varying vec3 vWorldPosition;
    void main() {
      float h = normalize(vWorldPosition + offset).y;
      gl_FragColor = vec4(mix(bottomColor, topColor, max(pow(max(h, 0.0), exponent), 0.0)), 1.0);
    }
  `
});
scene.add(new THREE.Mesh(skyGeo, skyMat));

// --- Ground / Terrain ---
function createTerrain() {
  const group = new THREE.Group();

  // Base ground
  const groundGeo = new THREE.PlaneGeometry(300, 300, 80, 80);
  const pos = groundGeo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i);
    const y = pos.getY(i);
    let z = 0;
    // Rolling hills
    const dist = Math.sqrt(x * x + y * y);
    z -= Math.sin(x * 0.02) * 3 + Math.cos(y * 0.025) * 3;
    z -= Math.sin(x * 0.05 + y * 0.04) * 1.5;
    // Cliff area near waterfall
    if (x > -20 && x < 30 && y > -15 && y < 20) {
      const d = Math.sqrt((x-5)*(x-5) + (y-5)*(y-5));
      z -= Math.max(0, 12 - d * 0.3);
    }
    // River bed
    if (y > 0 && y < 40 && x > -15 && x < 15) {
      z -= 2 + Math.sin(y * 0.1) * 1;
    }
    pos.setZ(i, z);
  }
  groundGeo.computeVertexNormals();

  const groundMat = new THREE.MeshStandardMaterial({
    color: 0x4a7a3a,
    roughness: 0.9,
    metalness: 0,
    flatShading: false,
  });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -2;
  ground.receiveShadow = true;
  group.add(ground);

  // River/water body at bottom
  const waterGeo = new THREE.PlaneGeometry(20, 40, 20, 20);
  const waterMat = new THREE.MeshStandardMaterial({
    color: 0x2d7a9a,
    transparent: true,
    opacity: 0.6,
    roughness: 0.2,
    metalness: 0.1,
    side: THREE.DoubleSide,
  });
  const water = new THREE.Mesh(waterGeo, waterMat);
  water.rotation.x = -Math.PI / 2;
  water.position.set(0, -1, 22);
  group.add(water);

  return group;
}
scene.add(createTerrain());

// --- Cliff / Mountain Face ---
function createCliff() {
  const group = new THREE.Group();

  // Main cliff wall
  const cliffGeo = new THREE.BoxGeometry(50, 45, 8);
  const cliffMat = new THREE.MeshStandardMaterial({
    color: 0x6d5a4a,
    roughness: 0.95,
    metalness: 0,
  });
  const cliff = new THREE.Mesh(cliffGeo, cliffMat);
  cliff.position.set(5, 18, -5);
  cliff.castShadow = true;
  group.add(cliff);

  // Cliff detail rocks
  for (let i = 0; i < 40; i++) {
    const size = 1 + Math.random() * 4;
    const rockGeo = new THREE.DodecahedronGeometry(size);
    const rockMat = new THREE.MeshStandardMaterial({
      color: new THREE.Color().setHSL(0.07 + Math.random() * 0.05, 0.15, 0.3 + Math.random() * 0.25),
      roughness: 0.9,
    });
    const rock = new THREE.Mesh(rockGeo, rockMat);
    const angle = Math.random() * Math.PI * 2;
    const radius = 10 + Math.random() * 20;
    rock.position.set(
      5 + Math.cos(angle) * radius,
      5 + Math.random() * 35,
      -8 + Math.random() * 6
    );
    rock.rotation.set(Math.random() * 2, Math.random() * 2, Math.random() * 2);
    rock.scale.set(1, 0.6 + Math.random() * 0.8, 0.4 + Math.random() * 0.6);
    rock.castShadow = true;
    group.add(rock);
  }

  return group;
}
scene.add(createCliff());

// --- Waterfall ---
function createWaterfall() {
  const group = new THREE.Group();

  // Main waterfall curtain - particle system
  const particleCount = 6000;
  const positions = new Float32Array(particleCount * 3);
  const sizes = new Float32Array(particleCount);
  const velocities = new Float32Array(particleCount);
  const offsets = new Float32Array(particleCount);

  const waterfallWidth = 28;
  const waterfallHeight = 32;

  for (let i = 0; i < particleCount; i++) {
    const i3 = i * 3;
    positions[i3] = (Math.random() - 0.5) * waterfallWidth;
    positions[i3 + 1] = Math.random() * waterfallHeight + 5;
    positions[i3 + 2] = (Math.random() - 0.5) * 2.5 + 0.5;
    sizes[i] = 0.15 + Math.random() * 0.35;
    velocities[i] = 0.4 + Math.random() * 0.6;
    offsets[i] = Math.random() * 100;
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

  const mat = new THREE.ShaderMaterial({
    uniforms: {
      uTime: { value: 0 },
      uColor: { value: new THREE.Color(0xc8e8f8) },
    },
    transparent: true,
    opacity: 0.7,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    vertexShader: `
      attribute float size;
      uniform float uTime;
      varying float vAlpha;
      void main() {
        vec3 pos = position;
        float speed = 0.4 + position.y * 0.015;
        float offset = position.x * 1.3 + position.y * 0.7;
        pos.y -= mod(uTime * speed + offset * 0.1, 35.0);
        vAlpha = smoothstep(0.0, 3.0, pos.y) * (1.0 - smoothstep(30.0, 35.0, pos.y));
        vAlpha *= 0.7 + 0.3 * sin(position.x * 0.5 + uTime * 2.0);
        vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
        gl_PointSize = size * (120.0 / -mvPosition.z);
        gl_Position = projectionMatrix * mvPosition;
      }
    `,
    fragmentShader: `
      uniform vec3 uColor;
      varying float vAlpha;
      void main() {
        vec2 center = gl_PointCoord - vec2(0.5);
        float dist = length(center);
        if (dist > 0.5) discard;
        float alpha = smoothstep(0.5, 0.0, dist) * vAlpha * 0.7;
        gl_FragColor = vec4(uColor, alpha);
      }
    `
  });

  const particles = new THREE.Points(geo, mat);
  particles.position.set(5, 10, 0);
  group.add(particles);

  // Waterfall solid sheet (semi-transparent)
  const sheetGeo = new THREE.PlaneGeometry(waterfallWidth - 4, waterfallHeight + 5, 40, 40);
  const sheetPos = sheetGeo.attributes.position;
  for (let i = 0; i < sheetPos.count; i++) {
    const x = sheetPos.getX(i);
    const y = sheetPos.getY(i);
    const wave = Math.sin(x * 0.3 + y * 0.5) * 0.3 + Math.sin(x * 0.7 + y * 0.2) * 0.2;
    sheetPos.setZ(i, wave);
  }
  sheetGeo.computeVertexNormals();

  const sheetMat = new THREE.ShaderMaterial({
    uniforms: {
      uTime: { value: 0 },
    },
    transparent: true,
    opacity: 0.25,
    side: THREE.DoubleSide,
    depthWrite: false,
    vertexShader: `
      uniform float uTime;
      varying float vFlow;
      void main() {
        vec3 pos = position;
        float flow = sin(pos.x * 0.5 + pos.y * 0.3 + uTime * 2.0) * 0.3;
        pos.z += flow;
        pos.y += sin(uTime * 0.5 + pos.x * 0.8) * 0.15;
        vFlow = flow;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
      }
    `,
    fragmentShader: `
      uniform float uTime;
      varying float vFlow;
      void main() {
        float alpha = 0.2 + 0.1 * sin(vFlow * 2.0 + uTime);
        gl_FragColor = vec4(0.7, 0.85, 0.95, alpha);
      }
    `
  });
  const sheet = new THREE.Mesh(sheetGeo, sheetMat);
  sheet.position.set(5, 26, 0.8);
  group.add(sheet);

  // Waterfall mist at bottom
  const mistParticles = 1500;
  const mPos = new Float32Array(mistParticles * 3);
  const mSizes = new Float32Array(mistParticles);
  for (let i = 0; i < mistParticles; i++) {
    const i3 = i * 3;
    const angle = Math.random() * Math.PI * 2;
    const radius = Math.random() * 15;
    mPos[i3] = 5 + Math.cos(angle) * radius;
    mPos[i3 + 1] = 2 + Math.random() * 4;
    mPos[i3 + 2] = Math.sin(angle) * radius * 0.5 + 2;
    mSizes[i] = 0.5 + Math.random() * 1.5;
  }
  const mGeo = new THREE.BufferGeometry();
  mGeo.setAttribute('position', new THREE.BufferAttribute(mPos, 3));
  mGeo.setAttribute('size', new THREE.BufferAttribute(mSizes, 1));
  const mMat = new THREE.ShaderMaterial({
    transparent: true,
    opacity: 0.3,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    uniforms: { uTime: { value: 0 } },
    vertexShader: `
      attribute float size;
      uniform float uTime;
      varying float vAlpha;
      void main() {
        vec3 pos = position;
        pos.x += sin(uTime * 0.3 + position.y) * 0.5;
        pos.z += cos(uTime * 0.4 + position.x) * 0.5;
        float dist = length(pos.xz - vec2(5.0, 2.0));
        vAlpha = exp(-dist * 0.15) * 0.4;
        vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
        gl_PointSize = size * (80.0 / -mvPosition.z);
        gl_Position = projectionMatrix * mvPosition;
      }
    `,
    fragmentShader: `
      varying float vAlpha;
      void main() {
        vec2 c = gl_PointCoord - vec2(0.5);
        if (length(c) > 0.5) discard;
        gl_FragColor = vec4(0.85, 0.92, 0.98, vAlpha * (1.0 - length(c) * 2.0));
      }
    `
  });
  const mist = new THREE.Points(mGeo, mMat);
  group.add(mist);

  // Splash particles at bottom
  const splashCount = 800;
  const sPos = new Float32Array(splashCount * 3);
  const sVel = new Float32Array(splashCount * 3);
  for (let i = 0; i < splashCount; i++) {
    const i3 = i * 3;
    const angle = Math.random() * Math.PI * 2;
    const r = Math.random() * 12;
    sPos[i3] = 5 + Math.cos(angle) * r;
    sPos[i3 + 1] = 1 + Math.random() * 2;
    sPos[i3 + 2] = Math.sin(angle) * r * 0.4 + 2;
    sVel[i3] = (Math.random() - 0.5) * 2;
    sVel[i3 + 1] = 1 + Math.random() * 3;
    sVel[i3 + 2] = (Math.random() - 0.5) * 1;
  }
  const sGeo = new THREE.BufferGeometry();
  sGeo.setAttribute('position', new THREE.BufferAttribute(sPos, 3));
  const sMat = new THREE.PointsMaterial({
    color: 0xaaddff,
    size: 0.2,
    transparent: true,
    opacity: 0.4,
    blending: THREE.AdditiveBlending,
  });
  const splash = new THREE.Points(sGeo, sMat);
  group.add(splash);

  // Store references for animation
  group.userData = { particles, sheet, mist, splash, sVel, sCount: splashCount };

  return group;
}
const waterfall = createWaterfall();
scene.add(waterfall);

// --- Vegetation ---
function createVegetation() {
  const group = new THREE.Group();

  // Trees
  for (let i = 0; i < 30; i++) {
    const treeGroup = new THREE.Group();
    const height = 3 + Math.random() * 6;

    // Trunk
    const trunkGeo = new THREE.CylinderGeometry(0.2 + Math.random() * 0.15, 0.3 + Math.random() * 0.2, height * 0.5, 4);
    const trunkMat = new THREE.MeshStandardMaterial({ color: 0x5d4037, roughness: 0.9 });
    const trunk = new THREE.Mesh(trunkGeo, trunkMat);
    trunk.position.y = height * 0.25;
    trunk.castShadow = true;
    treeGroup.add(trunk);

    // Canopy - multiple spheres
    const canopyColor = new THREE.Color().setHSL(0.28 + Math.random() * 0.07, 0.5, 0.3 + Math.random() * 0.2);
    for (let j = 0; j < 3 + Math.floor(Math.random() * 3); j++) {
      const r = 1 + Math.random() * 2.5;
      const cGeo = new THREE.SphereGeometry(r, 6, 6);
      const cMat = new THREE.MeshStandardMaterial({
        color: canopyColor,
        roughness: 0.8,
        metalness: 0,
      });
      const c = new THREE.Mesh(cGeo, cMat);
      c.position.set(
        (Math.random() - 0.5) * r,
        height * 0.5 + Math.random() * r * 0.5,
        (Math.random() - 0.5) * r * 0.6
      );
      c.scale.y = 0.7 + Math.random() * 0.3;
      c.castShadow = true;
      treeGroup.add(c);
    }

    // Place around the scene
    const angle = Math.random() * Math.PI * 2;
    const dist = 15 + Math.random() * 40;
    const tx = 5 + Math.cos(angle) * dist;
    const tz = Math.sin(angle) * dist - 5;
    // Keep away from waterfall area
    if (Math.abs(tx - 5) < 18 && tz > -5 && tz < 15) continue;

    treeGroup.position.set(tx, 0, tz);
    treeGroup.rotation.y = Math.random() * Math.PI * 2;
    treeGroup.scale.setScalar(0.6 + Math.random() * 0.8);
    group.add(treeGroup);
  }

  // Bushes/grass tufts near waterfall
  for (let i = 0; i < 60; i++) {
    const bushGeo = new THREE.SphereGeometry(0.3 + Math.random() * 0.6, 5, 5);
    const bushMat = new THREE.MeshStandardMaterial({
      color: new THREE.Color().setHSL(0.28 + Math.random() * 0.06, 0.5, 0.25 + Math.random() * 0.2),
      roughness: 0.9,
    });
    const bush = new THREE.Mesh(bushGeo, bushMat);
    const angle = Math.random() * Math.PI * 2;
    const r = 5 + Math.random() * 12;
    bush.position.set(
      5 + Math.cos(angle) * r,
      0.3 + Math.random() * 1,
      Math.sin(angle) * r * 0.6 + 2
    );
    bush.scale.set(1, 0.5 + Math.random() * 0.5, 0.8);
    bush.castShadow = true;
    group.add(bush);
  }

  return group;
}
scene.add(createVegetation());

// --- Water Curtain Cave (水帘洞) ---
function createCave() {
  const group = new THREE.Group();

  // Cave opening
  const archGeo = new THREE.TorusGeometry(5, 1.5, 8, 16, Math.PI);
  const archMat = new THREE.MeshStandardMaterial({
    color: 0x4a3a2a,
    roughness: 0.95,
    metalness: 0,
  });
  const arch = new THREE.Mesh(archGeo, archMat);
  arch.position.set(5, 10, -5);
  arch.rotation.x = Math.PI;
  group.add(arch);

  // Cave interior glow
  const glowGeo = new THREE.PlaneGeometry(8, 6);
  const glowMat = new THREE.MeshStandardMaterial({
    color: 0x4a2010,
    transparent: true,
    opacity: 0.3,
    side: THREE.DoubleSide,
  });
  const glow = new THREE.Mesh(glowGeo, glowMat);
  glow.position.set(5, 10, -6.5);
  group.add(glow);

  return group;
}
scene.add(createCave());

// --- Rainbow (arc) ---
function createRainbow() {
  const points = [];
  const radius = 18;
  for (let i = 0; i <= 40; i++) {
    const t = i / 40;
    const angle = t * Math.PI + Math.PI * 0.1;
    points.push(new THREE.Vector3(
      5 + Math.cos(angle) * radius,
      8 + Math.sin(angle) * radius,
      15 + Math.sin(t * Math.PI) * 3
    ));
  }
  const curve = new THREE.CatmullRomCurve3(points);
  const tubeGeo = new THREE.TubeGeometry(curve, 40, 0.3, 6, false);
  const tubeMat = new THREE.MeshStandardMaterial({
    color: 0xffffff,
    transparent: true,
    opacity: 0.15,
    side: THREE.DoubleSide,
    emissive: new THREE.Color(0xffffff),
    emissiveIntensity: 0.3,
  });
  return new THREE.Mesh(tubeGeo, tubeMat);
}
scene.add(createRainbow());

// --- Stones in water ---
function createStones() {
  const group = new THREE.Group();
  for (let i = 0; i < 20; i++) {
    const size = 0.3 + Math.random() * 1.5;
    const geo = new THREE.DodecahedronGeometry(size);
    const mat = new THREE.MeshStandardMaterial({
      color: new THREE.Color().setHSL(0.08, 0.1, 0.3 + Math.random() * 0.3),
      roughness: 0.9,
    });
    const stone = new THREE.Mesh(geo, mat);
    const angle = Math.random() * Math.PI * 2;
    const r = 3 + Math.random() * 6;
    stone.position.set(
      5 + Math.cos(angle) * r,
      -1 + size * 0.3,
      20 + Math.sin(angle) * r * 0.5
    );
    stone.rotation.set(Math.random() * 3, Math.random() * 3, Math.random() * 3);
    stone.scale.set(1, 0.4 + Math.random() * 0.3, 0.6 + Math.random() * 0.4);
    group.add(stone);
  }
  return group;
}
scene.add(createStones());

// --- Distant mountains ---
function createMountains() {
  const group = new THREE.Group();
  for (let i = 0; i < 8; i++) {
    const angle = (i / 8) * Math.PI * 2 + Math.random() * 0.3;
    const dist = 80 + Math.random() * 40;
    const height = 15 + Math.random() * 25;

    const geo = new THREE.ConeGeometry(15 + Math.random() * 20, height, 6 + Math.floor(Math.random() * 3));
    const mat = new THREE.MeshStandardMaterial({
      color: new THREE.Color().setHSL(0.25 + Math.random() * 0.05, 0.3, 0.25 + Math.random() * 0.15),
      roughness: 0.9,
    });
    const m = new THREE.Mesh(geo, mat);
    m.position.set(
      5 + Math.cos(angle) * dist,
      height * -0.3,
      Math.sin(angle) * dist - 5
    );
    m.rotation.y = Math.random() * 3;
    group.add(m);
  }
  return group;
}
scene.add(createMountains());

// --- Animation ---
const clock = new THREE.Clock();

function animate() {
  const t = clock.getElapsedTime();

  // Animate waterfall
  const wd = waterfall.userData;
  if (wd.particles) wd.particles.material.uniforms.uTime.value = t;
  if (wd.sheet) wd.sheet.material.uniforms.uTime.value = t;
  if (wd.mist) wd.mist.material.uniforms.uTime.value = t;

  // Animate splash
  if (wd.splash) {
    const pos = wd.splash.geometry.attributes.position;
    const vel = wd.sVel;
    for (let i = 0; i < wd.sCount; i++) {
      const i3 = i * 3;
      pos.array[i3] += vel[i3] * 0.05;
      pos.array[i3 + 1] += vel[i3 + 1] * 0.05;
      pos.array[i3 + 2] += vel[i3 + 2] * 0.05;
      vel[i3 + 1] -= 0.08;
      if (pos.array[i3 + 1] < 0) {
        pos.array[i3] = 5 + (Math.random() - 0.5) * 12;
        pos.array[i3 + 1] = 1 + Math.random() * 2;
        pos.array[i3 + 2] = 2 + (Math.random() - 0.5) * 5;
        vel[i3] = (Math.random() - 0.5) * 2;
        vel[i3 + 1] = 1 + Math.random() * 3;
        vel[i3 + 2] = (Math.random() - 0.5) * 1;
      }
    }
    pos.needsUpdate = true;
  }

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}

animate();

// --- Resize ---
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// --- Hide loading ---
setTimeout(() => {
  document.getElementById('loading')?.classList.add('hidden');
}, 800);
</script>
</body>
</html>

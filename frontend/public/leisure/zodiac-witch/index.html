  // ---------- nav buttons ----------
  $('#startBtn').onclick=function(){ startTest(); };
  $('#chatBtn').onclick=function(){ openChat(); };
  $('#wikiBtn').onclick=function(){ renderWiki(); show('wiki'); };

  // ---------- test ----------
  var idx=0, scores={fire:0,earth:0,air:0,water:0}, order=['fire','earth','air','water'];
  function startTest(){ idx=0; scores={fire:0,earth:0,air:0,water:0}; show('test'); renderQ(); }
  function renderQ(){
    var q=QUESTIONS[idx];
    $('#prog').style.width=((idx)/QUESTIONS.length*100)+'%';
    $('#qNum').textContent='第 '+(idx+1)+' / '+QUESTIONS.length+' 题';
    $('#qText').textContent=q.q;
    var box=$('#qOpts'); box.innerHTML='';
    q.o.forEach(function(txt,i){
      var b=document.createElement('button'); b.className='opt';
      var k=document.createElement('span'); k.className='k'; k.textContent=['A','B','C','D'][i];
      var t=document.createElement('span'); t.textContent=txt;
      b.appendChild(k); b.appendChild(t);
      b.onclick=function(){ scores[q.e[i]]++; idx++; if(idx<QUESTIONS.length){ renderQ(); } else { $('#prog').style.width='100%'; showResult(); } };
      box.appendChild(b);
    });
  }
  function showResult(){
    var top=order.slice().sort(function(a,b){ return scores[b]-scores[a]; })[0];
    var el=ELEMENTS[top];
    var max=Math.max.apply(null, order.map(function(k){return scores[k];}), 1);
    var seed=order.reduce(function(a,k,i){return a+scores[k]*(i+1);}, idx);
    var sign=el.signs[seed%el.signs.length];
    var s=SIGNS[sign];
    $('#rGlyph').textContent=s.g;
    $('#rName').textContent='灵魂星座 · '+sign;
    $('#rElement').textContent=el.icon+' '+el.name+' · '+el.desc;
    $('#rTrait').textContent='你的星座原型：'+s.t;
    $('#rBless').innerHTML='<b>✨ 星铃对你说：</b><br>原来你身体里住着「'+sign+'」的灵魂呀~ 星座是你的一面镜子，照见你的闪光，也提醒你温柔地拥抱自己。无论太阳星座是什么，此刻开始，请骄傲地做独一无二的你 🌟';
    var bars=$('#bars'); bars.innerHTML='';
    order.forEach(function(k){
      var pct=Math.round(scores[k]/max*100);
      var row=document.createElement('div'); row.className='bar-row';
      row.innerHTML='<span>'+ELEMENTS[k].icon+' '+ELEMENTS[k].name+'</span><span class="bar-track"><span class="bar-fill" style="width:'+pct+'%;background:'+ELEMENTS[k].color+'"></span></span><span>'+scores[k]+'</span>';
      bars.appendChild(row);
    });
    show('result');
  }
  $('#retryBtn').onclick=function(){ startTest(); };

  // ---------- wiki ----------
  function renderWiki(){
    var elBox=$('#elements'); elBox.innerHTML='';
    order.forEach(function(k){
      var e=ELEMENTS[k];
      var d=document.createElement('div'); d.className='element';
      d.innerHTML='<span class="ico">'+e.icon+'</span><div><div class="hd">'+e.name+'（'+e.signs.join(' / ')+'）</div><div class="ds">'+e.desc+'</div></div>';
      elBox.appendChild(d);
    });
    var sBox=$('#signs'); sBox.innerHTML='';
    Object.keys(SIGNS).forEach(function(nm){
      var s=SIGNS[nm];
      var c=document.createElement('div'); c.className='sign-card';
      c.innerHTML='<div class="glyph">'+s.g+'</div><div class="nm">'+nm+'</div><div class="tr">'+ELEMENTS[s.e].icon+' '+ELEMENTS[s.e].name+' · '+s.t+'</div>';
      sBox.appendChild(c);
    });
  }

  // ---------- chat ----------
  var QUICK=['我的灵魂星座是什么？','火象的人什么样？','水象的朋友有什么特点？','最近有点焦虑，怎么办','星座配对靠谱吗？'];
  function openChat(){
    renderChips(); show('chat');
    if(!$('#chatbox').children.length){ pushMsg('luna','你好呀小可爱~ 我是星铃，掌管黄道十二宫的小魔女 🌟 想聊聊星座，还是测测灵魂星座呀？'); }
    $('#chatInput').focus();
  }
  function renderChips(){
    var box=$('#chips'); box.innerHTML='';
    QUICK.forEach(function(q){ var c=document.createElement('span'); c.className='chip'; c.textContent=q; c.onclick=function(){ send(q); }; box.appendChild(c); });
  }
  function pushMsg(role,text){
    var box=$('#chatbox'); var d=document.createElement('div'); d.className='msg '+role; d.textContent=text;
    box.appendChild(d); box.scrollTop=box.scrollHeight; return d;
  }
  function getKey(){ return localStorage.getItem('deepseek_api_key')||localStorage.getItem('shared_deepseek_api_key'); }
  function localReply(t){
    t=t.toLowerCase();
    if(/灵魂星座|我的星座|什么星座|测测/.test(t)) return '想知道你的灵魂星座，光问可不够哦~ 🔮 点上面的「开始灵魂星座测试」，用 12 道情境题让我感应你的性格原型吧 ✨';
    if(/白羊|狮子|射手|火象/.test(t)) return '火象的你，像燃烧的小太阳 🔥 行动力超强、热情奔放！不过也要记得偶尔停下来，抱抱辛苦的自己呀~';
    if(/金牛|处女|摩羯|土象/.test(t)) return '土象的朋友最靠谱啦，像大地一样稳稳的 🌍 务实又长情，不过有时候也要允许自己任性一次哦~';
    if(/双子|天秤|水瓶|风象/.test(t)) return '风象的你，是行走的灵感与话题 🌪️ 思维活跃、天生社交达人，记得也给自己留一点安静思考的时间~';
    if(/巨蟹|天蝎|双鱼|水象/.test(t)) return '水象的你，内心像深海一样温柔深邃 🌊 共情力超强，总是先照顾别人，也别忘了好好爱自己呀~';
    if(/焦虑|难过|累|压力|emo|不开心|烦/.test(t)) return '先抱抱你呀~ ✨ 焦虑的时候，试试像土象一样先落地：把最想做的一件小事完成，稳稳地找回掌控感 🌍 你愿意试试吗？';
    if(/爱情|喜欢|恋爱|配对|合适/.test(t)) return '星座配对是很有趣的关系参考，但从来不是标准答案哦 💞 两个人是否合拍，靠的是理解与经营，而不是星盘~';
    if(/谢谢|你好|嗨|hello|hi/.test(t)) return '不客气呀小可爱~ 🌟 能帮到你，星铃最开心啦！还有什么想聊的？';
    if(/你是谁|介绍|名字/.test(t)) return '我是星铃，星穹魔法学院毕业的星座小魔女 🔮 掌管黄道十二宫的性格星盘，专治各种「我到底像哪个星座」的困惑 ✨';
    return '嗯……这个问题有点意思，让星铃转一下水晶球 🔮 不如我们先从「灵魂星座测试」开始？或者问我火象/土象/风象/水象的差别也行哦~';
  }
  async function aiReply(text){
    var key=getKey();
    if(!key) return null;
    try{
      var res=await fetch('https://api.deepseek.com/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify({model:'deepseek-v4-flash',messages:[{role:'system',content:SYSTEM},{role:'user',content:text}],stream:false,temperature:0.8,max_tokens:600})});
      if(!res.ok) return null;
      var data=await res.json();
      return (data.choices&&data.choices[0]&&data.choices[0].message&&data.choices[0].message.content)||null;
    }catch(e){ return null; }
  }
  async function send(text){
    text=(text||$('#chatInput').value||'').trim();
    if(!text) return;
    $('#chatInput').value='';
    pushMsg('me',text);
    var typing=pushMsg('luna','✨ 星铃感应中…');
    var reply=await aiReply(text);
    if(!reply){ await new Promise(function(r){setTimeout(r,500);}); reply=localReply(text); }
    typing.textContent=reply;
    var box=$('#chatbox'); box.scrollTop=box.scrollHeight;
  }
  $('#sendBtn').onclick=function(){ send(); };
  $('#chatInput').addEventListener('keydown',function(e){ if(e.key==='Enter') send(); });
})();
</script>
</body>
</html>

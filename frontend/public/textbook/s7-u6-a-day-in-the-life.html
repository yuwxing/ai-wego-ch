<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit 6 - A Day in the Life - LEGO Routine!</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --bg:#f8f9fa; --grid:#e9ecef;
    --lego-red:#e32121; --lego-blue:#006cb7; --lego-yellow:#ffd400; --lego-green:#009640;
    --lego-orange:#ff7d00; --lego-purple:#97007d;
    --text:#1c1c1e; --muted:#8e8e93;
  }
  html,body { width:100%; height:100%; font-family:"Comic Sans MS","Comic Neue","PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); overflow:hidden; }

  /* Start */
  #start { position:fixed; inset:0; background:linear-gradient(135deg,#009640,#3fc070); z-index:1000; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; transition:opacity .6s; color:#fff; }
  #start.hidden { opacity:0; pointer-events:none; }
  .logo { font-size:clamp(60px,10vw,120px); font-weight:900; letter-spacing:4px; color:#fff; margin-bottom:10px; text-shadow:6px 6px 0 #006b2e; transform:skewX(-6deg); }
  .st { font-size:clamp(20px,3vw,40px); font-weight:800; color:#fff; margin-bottom:24px; }
  .blocks { display:flex; gap:10px; margin-bottom:20px; }
  .t-block { width:clamp(40px,7vw,80px); height:clamp(40px,7vw,80px); background:var(--lego-yellow); border-radius:10px; position:relative; display:flex; align-items:center; justify-content:center; box-shadow:inset 0 -8px 0 rgba(0,0,0,.18), inset 0 8px 0 rgba(255,255,255,.2), 0 12px 0 #c7a100,0 18px 20px rgba(0,0,0,.25); animation:bounce 1.2s infinite; }
  .t-block.red { background:var(--lego-red); animation-delay:.15s; box-shadow:inset 0 -8px 0 rgba(0,0,0,.18), inset 0 8px 0 rgba(255,255,255,.2), 0 12px 0 #b51a1a,0 18px 20px rgba(0,0,0,.25); }
  .t-block.blue { background:var(--lego-blue); animation-delay:.3s; box-shadow:inset 0 -8px 0 rgba(0,0,0,.18), inset 0 8px 0 rgba(255,255,255,.2), 0 12px 0 #004f83,0 18px 20px rgba(0,0,0,.25); }
  .t-block::after { content:''; width:50%; height:50%; border:3px solid rgba(255,255,255,.35); border-radius:50%; box-shadow:inset 0 2px 0 rgba(255,255,255,.3); }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-14px)} }
  .hint { font-size:clamp(16px,3.20vw,43px); color:rgba(255,255,255,.7); margin-top:20px; animation:pulse 1.6s infinite; }
  @keyframes pulse { 0%,100%{opacity:.6} 50%{opacity:1} }

  /* UI */
  #ui { width:100%; height:100%; display:none; flex-direction:column; padding:clamp(10px,1.5vh,20px) clamp(10px,2vw,30px); }
  .top { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:10px; }
  .chip { background:#fff; border:3px solid #000; border-radius:14px; padding:clamp(6px,1vh,12px) clamp(14px,2vw,24px); font-size:clamp(14px,2.88vw,40px); font-weight:800; box-shadow:0 6px 0 #000; display:flex; align-items:center; gap:8px; }
  .chip .lab { color:#8e8e93; font-weight:600; }
  .chip .val { color:var(--lego-red); font-size:clamp(18px,4.00vw,54px); }

  /* Game area */
  .game { flex:1; display:grid; grid-template-columns:1fr .9fr; gap:clamp(12px,2vw,28px); min-height:0; }
  @media (max-width:900px){ .game{grid-template-columns:1fr; grid-template-rows:1fr 1fr} }

  /* Timeline */
  .timeline { background:#fff; border:4px solid #000; border-radius:18px; padding:clamp(14px,2vw,28px); box-shadow:0 12px 0 #000; display:flex; flex-direction:column; min-height:0; overflow:auto; }
  .timeline-title { font-size:clamp(16px,3.52vw,47px); font-weight:900; margin-bottom:12px; text-align:center; }
  .cards { display:flex; flex-direction:column; gap:10px; }
  .card { background:#f8f9fa; border:3px solid #000; border-radius:14px; padding:12px 16px; font-size:clamp(14px,2.88vw,36px); font-weight:800; display:flex; justify-content:space-between; align-items:center; gap:8px; box-shadow:0 8px 0 #000; cursor:pointer; }
  .card.correct { background:var(--lego-green); color:#fff; }
  .card .time { color:#8e8e93; }

  /* Question */
  .q-area { background:#fff; border:4px solid #000; border-radius:18px; padding:clamp(14px,2vw,28px); box-shadow:0 12px 0 #000; display:flex; flex-direction:column; gap:10px; min-height:0; }
  .q-title { font-size:clamp(16px,3.52vw,47px); font-weight:900; text-align:center; }
  .q-card { background:#f8f9fa; border:3px solid #000; border-radius:14px; padding:12px 16px; font-size:clamp(14px,2.88vw,36px); font-weight:800; }
  .q-hint { font-size:clamp(12px,2.56vw,32px); color:#8e8e93; text-align:center; }

  /* Lego */
  .lego { position:relative; display:flex; align-items:center; justify-content:center; padding:clamp(10px,1.4vh,16px) clamp(14px,1.8vw,26px); font-size:clamp(14px,2.88vw,40px); font-weight:900; color:#fff; border:none; cursor:pointer; border-radius:12px; box-shadow:inset 0 -10px 0 rgba(0,0,0,.18), inset 0 10px 0 rgba(255,255,255,.18), 0 10px 0 #000; transition:transform .08s, box-shadow .08s, opacity .2s; }
  .lego:hover { transform:translateY(-3px); }
  .lego:active { transform:translateY(6px); box-shadow:inset 0 -10px 0 rgba(0,0,0,.18), inset 0 10px 0 rgba(255,255,255,.18), 0 4px 0 #000; }
  .lego.red { background:var(--lego-red); }
  .lego.blue { background:var(--lego-blue); }
  .lego.yellow { background:var(--lego-yellow); color:#000; }
  .lego.green { background:var(--lego-green); }
  .lego.orange { background:var(--lego-orange); }

  .studs { position:absolute; top:-8px; left:50%; transform:translateX(-50%); display:flex; gap:8px; }
  .stud { width:16px; height:12px; border-radius:6px 6px 0 0; background:inherit; border:3px solid rgba(0,0,0,.12); border-bottom:none; box-shadow:inset 0 2px 0 rgba(255,255,255,.25); }

  /* Controls */
  .bottom { display:flex; justify-content:center; gap:12px; margin-top:10px; }

  /* Modal */
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.5); display:none; align-items:center; justify-content:center; z-index:500; }
  .modal.show { display:flex; }
  .m-card { background:#fff; border:5px solid #000; border-radius:20px; padding:30px 40px; box-shadow:0 18px 0 #000; text-align:center; max-width:90vw; animation:scaleIn .3s cubic-bezier(.175,.885,.32,1.275); }
  @keyframes scaleIn { from{transform:scale(.8);opacity:0} to{transform:scale(1);opacity:1} }
  .m-emoji { font-size:clamp(50px,8vw,80px); margin-bottom:10px; }
  .m-title { font-size:clamp(24px,3.5vw,40px); font-weight:900; color:#000; margin-bottom:8px; }
  .m-sub { font-size:clamp(16px,3.20vw,43px); color:#555; margin-bottom:16px; font-weight:700; }
  .m-btns { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }

  /* Effects */
  .star { position:fixed; pointer-events:none; font-size:clamp(22px,3.5vw,40px); animation:starPop .8s ease-out forwards; z-index:999; }
  @keyframes starPop { 0%{transform:scale(0) rotate(0);opacity:1} 100%{transform:scale(1.6) rotate(200deg);opacity:0} }

</style>
</head>
<body>

<div id="start">
  <div class="logo">A DAY IN THE LIFE</div>
  <div class="st">日常作息排序</div>
  <div class="blocks">
    <div class="t-block red"></div>
    <div class="t-block yellow"></div>
    <div class="t-block blue"></div>
  </div>
  <div class="hint">点击任意处开始</div>
</div>

<div id="ui">
  <div class="top">
    <div class="chip"><span class="lab">得分</span><span class="val" id="score">0</span></div>
    <div class="chip"><span class="lab">正确</span><span class="val" id="correct">0/6</span></div>
    <div class="chip"><span class="lab">连击</span><span class="val" id="combo">🔥 0</span></div>
  </div>

  <div class="game">
    <!-- Timeline -->
    <div class="timeline">
      <div class="timeline-title">⏰ 一天的作息</div>
      <div class="cards" id="timeline"></div>
    </div>

    <!-- Q -->
    <div class="q-area">
      <div class="q-title">❓ 问题</div>
      <div class="q-card" id="qCard"></div>
      <div class="q-hint" id="qHint">💡 选择正确的活动</div>
      <div style="display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:8px;" id="qOpts"></div>
    </div>
  </div>

  <div class="bottom">
    <button class="lego blue" id="resetBtn">
      <span class="studs"><span class="stud"></span><span class="stud"></span></span>
      重置
    </button>
  </div>
</div>

<div class="modal" id="modal">
  <div class="m-card">
    <div class="m-emoji" id="mEmoji">🎉</div>
    <div class="m-title" id="mTitle">太棒了！</div>
    <div class="m-sub" id="mSub">你完成了！</div>
    <div class="m-btns">
      <button class="lego green" id="againBtn">
        <span class="studs"><span class="stud"></span><span class="stud"></span></span>
        再来一轮
      </button>
    </div>
  </div>
</div>

<script>
/* ===================== Sound ===================== */
class SoundEngine {
  constructor(){ this.ctx=null; this.ready=false; }
  init(){ if(this.ready) return; try{ this.ctx=new(window.AudioContext||window.webkitAudioContext)(); this.ready=true; }catch(e){} }
  play(type){
    if(!this.ctx) return; const now=this.ctx.currentTime;
    switch(type){
      case 'click': this.tone(700,0.06,'sine',0.08,now); break;
      case 'correct':
        this.tone(523,.12,'sine',.18,now); this.tone(659,.12,'sine',.18,now+.08); this.tone(784,.18,'sine',.18,now+.16); break;
      case 'win': [523,659,784,1047,784,1047].forEach((f,i)=>this.tone(f,.3,'sine',.14,now+i*.14)); break;
    }
  }
  tone(freq,dur,type,vol,t){
    const o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.connect(g); g.connect(this.ctx.destination); o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.start(t); o.stop(t+dur);
  }
}
const sound=new SoundEngine();

/* ===================== Data ===================== */
const ACTIVITIES = [
  {time:"6:30", text:"get up"},
  {time:"7:00", text:"have breakfast"},
  {time:"7:30", text:"go to school"},
  {time:"12:00", text:"have lunch"},
  {time:"17:30", text:"go home"},
  {time:"21:00", text:"go to bed"},
];

const QUESTIONS = [
  {q:"What time do you get up?", opts:["At 6:30","At 7:00","At 7:30"], answer:"At 6:30"},
  {q:"When do you go to school?", opts:["At 7:30","At 6:30","At 12:00"], answer:"At 7:30"},
  {q:"What time do you have lunch?", opts:["At 12:00","At 17:30","At 21:00"], answer:"At 12:00"},
  {q:"When do you go home?", opts:["At 17:30","At 7:30","At 12:00"], answer:"At 17:30"},
  {q:"What time do you go to bed?", opts:["At 21:00","At 17:30","At 12:00"], answer:"At 21:00"},
  {q:"When do you have breakfast?", opts:["At 7:00","At 6:30","At 7:30"], answer:"At 7:00"},
];

/* ===================== State ===================== */
let state = { qIdx:0, correct:new Set(), score:0, combo:0, waiting:false };

/* ===================== DOM ===================== */
const startEl=document.getElementById('start');
const uiEl=document.getElementById('ui');
const timelineEl=document.getElementById('timeline');
const qCardEl=document.getElementById('qCard');
const qHintEl=document.getElementById('qHint');
const qOptsEl=document.getElementById('qOpts');
const scoreEl=document.getElementById('score');
const correctEl=document.getElementById('correct');
const comboEl=document.getElementById('combo');
const resetBtn=document.getElementById('resetBtn');
const modal=document.getElementById('modal');
const mEmoji=document.getElementById('mEmoji');
const mTitle=document.getElementById('mTitle');
const mSub=document.getElementById('mSub');
const againBtn=document.getElementById('againBtn');

/* ===================== Init ===================== */
function init(){
  buildTimeline();
  loadQ(0);
  updateUI();
}

function buildTimeline(){
  timelineEl.innerHTML='';
  const shuffled=ACTIVITIES.slice().sort(()=>Math.random()-.5);
  shuffled.forEach(a=>{
    const el=document.createElement('div'); el.className='card';
    el.innerHTML=`<div>${a.text}</div><div class="time">${a.time}</div>`;
    el.dataset.time=a.time; el.dataset.text=a.text;
    timelineEl.appendChild(el);
  });
}

function loadQ(i){
  const q=QUESTIONS[i];
  state.waiting=false;
  qCardEl.textContent=q.q;
  qHintEl.textContent="💡 选择正确的回答";

  qOptsEl.innerHTML='';
  const shuffled=q.opts.slice().sort(()=>Math.random()-.5);
  const colors=['red','blue','yellow','green','orange','purple'];
  shuffled.forEach((opt,idx)=>{
    const btn=document.createElement('button'); btn.className='lego '+colors[idx%colors.length];
    btn.innerHTML=`<span class="studs"><span class="stud"></span>${opt.length>=8?'<span class="stud"></span>':''}</span>${opt}`;
    btn.addEventListener('click',()=>tryAnswer(opt,btn,q));
    qOptsEl.appendChild(btn);
  });
}

function tryAnswer(ans,btnEl,q){
  if(state.waiting) return;
  state.waiting=true;
  sound.init(); sound.play('click');

  const timeMap={
    "At 6:30": "get up",
    "At 7:00": "have breakfast",
    "At 7:30": "go to school",
    "At 12:00": "have lunch",
    "At 17:30": "go home",
    "At 21:00": "go to bed",
  };

  if(ans===q.answer){
    state.combo++;
    let pts=10; if(state.combo>=3) pts=15; if(state.combo>=5) pts=20;
    state.score+=pts;
    state.correct.add(ans);
    const text=timeMap[ans];
    const card=[...timelineEl.querySelectorAll('.card')].find(el=>el.dataset.text===text);
    if(card) card.classList.add('correct');
    sound.play('correct');
    spawnStars();
    qHintEl.textContent="🎉 正确！";
    setTimeout(()=>{
      state.qIdx++;
      if(state.qIdx>=QUESTIONS.length){
        sound.play('win'); showModal();
      }else{
        loadQ(state.qIdx);
      }
      state.waiting=false;
    },600);
  }else{
    state.combo=0;
    qHintEl.textContent="😅 再试一次";
    btnEl.style.animation='shake .4s ease';
    setTimeout(()=>{
      btnEl.style.animation='';
      state.waiting=false;
    },450);
  }
  updateUI();
}

function updateUI(){
  scoreEl.textContent=state.score;
  correctEl.textContent=state.correct.size+"/"+QUESTIONS.length;
  comboEl.textContent="🔥 "+state.combo;
}

function spawnStars(){
  const rect=timelineEl.getBoundingClientRect();
  for(let i=0;i<10;i++){
    const s=document.createElement('div'); s.className='star';
    s.textContent=['⭐','✨','🌟','💫'][Math.floor(Math.random()*4)];
    s.style.left=(rect.left+Math.random()*rect.width)+"px";
    s.style.top=(rect.top+Math.random()*rect.height)+"px";
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),800);
  }
}

function showModal(){
  mEmoji.textContent="🎉";
  mTitle.textContent="太棒了！";
  mSub.textContent="你得到 "+state.score+" 分！";
  modal.classList.add('show');
}

/* ===================== Events ===================== */
startEl.addEventListener('click',()=>{
  sound.init(); sound.play('click');
  startEl.classList.add('hidden');
  uiEl.style.display='flex';
  init();
});

resetBtn.addEventListener('click',()=>{
  sound.init(); sound.play('click');
  state={ qIdx:0, correct:new Set(), score:0, combo:0, waiting:false };
  buildTimeline();
  loadQ(0);
  updateUI();
});

againBtn.addEventListener('click',()=>{
  sound.init(); sound.play('click');
  modal.classList.remove('show');
  state={ qIdx:0, correct:new Set(), score:0, combo:0, waiting:false };
  buildTimeline();
  loadQ(0);
  updateUI();
});

/* Shake keyframe */
const style=document.createElement('style');
style.textContent='@keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-10px)} 40%{transform:translateX(10px)} 60%{transform:translateX(-6px)} 80%{transform:translateX(6px)} }';
document.head.appendChild(style);

</script>
</body>
</html>

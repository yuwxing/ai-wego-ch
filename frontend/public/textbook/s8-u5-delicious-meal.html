<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit 5 What a Delicious Meal!</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --bg:#fff7ed; --paper:#fffaf5; --border:#7c2d12; --accent:#f97316;
    --accent2:#fdba74; --green:#22c55e; --muted:#946a5a;
  }
  html,body { width:100%; height:100%; font-family:"Comic Sans MS","Comic Neue","PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); overflow:hidden; }

  /* Start */
  #start { position:fixed; inset:0; background:linear-gradient(135deg,#ffedd5,#fff7ed); z-index:1000; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; transition:opacity .6s; }
  #start.hidden { opacity:0; pointer-events:none; }
  .cover { background:var(--paper); border:5px solid var(--border); border-radius:24px; padding:40px 60px; box-shadow:0 14px 0 var(--border); text-align:center; transform:rotate(0.5deg); }
  .title { font-size:clamp(34px,6vw,60px); font-weight:900; color:var(--accent); margin-bottom:8px; }
  .subtitle { font-size:clamp(16px,4.00vw,50px); color:var(--border); font-weight:800; }
  .stickers { display:flex; gap:14px; justify-content:center; margin-top:18px; }
  .sticker { font-size:clamp(26px,4vw,44px); filter:drop-shadow(0 4px 0 rgba(0,0,0,.15)); animation:float 2.2s ease-in-out infinite; }
  .sticker:nth-child(2){ animation-delay:.25s }
  .sticker:nth-child(3){ animation-delay:.5s }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
  .hint { font-size:clamp(14px,3.20vw,40px); color:var(--muted); margin-top:28px; animation:pulse 1.6s infinite; }
  @keyframes pulse { 0%,100%{opacity:.6} 50%{opacity:1} }

  /* UI */
  #ui { width:100%; height:100%; display:none; flex-direction:column; padding:clamp(8px,1.2vh,16px) clamp(10px,1.8vw,28px); }
  .top { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:10px; }
  .tag { background:#fff; border:3px solid var(--border); border-radius:18px; padding:8px 16px; font-size:clamp(13px,2.88vw,36px); font-weight:800; box-shadow:0 6px 0 var(--border); display:flex; align-items:center; gap:8px; }
  .tag .lab { color:var(--muted); font-weight:700; }
  .tag .val { color:var(--accent); font-size:clamp(15px,3.20vw,43px); }

  /* Content */
  .board { flex:1; display:grid; grid-template-columns:1fr; gap:14px; min-height:0; }
  @media (min-width:1000px){ .board{grid-template-columns:1.15fr .85fr;} }

  .recipe { background:var(--paper); border:5px solid var(--border); border-radius:24px; padding:clamp(16px,2.2vw,34px); box-shadow:0 14px 0 var(--border); display:flex; flex-direction:column; min-height:0; overflow:auto; }
  .recipe-title { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .emoji-big { font-size:clamp(34px,5vw,54px); }
  .title-text { font-size:clamp(18px,4.16vw,54px); font-weight:900; color:var(--border); }
  .content { flex:1; display:flex; flex-direction:column; justify-content:center; gap:10px; }
  .step { background:#fff; border:4px solid var(--border); border-radius:16px; padding:14px 16px; font-size:clamp(14px,3.04vw,38px); font-weight:800; color:var(--border); box-shadow:0 8px 0 var(--border); line-height:1.55; }
  .context { font-size:clamp(12px,2.56vw,31px); color:var(--muted); margin-bottom:8px; font-weight:700; }
  .step .gap { display:inline-flex; align-items:center; justify-content:center; min-width:160px; border-bottom:4px solid var(--border); padding:0 8px; color:var(--accent); }

  .panel { background:var(--paper); border:5px solid var(--border); border-radius:24px; padding:clamp(16px,2.2vw,34px); box-shadow:0 14px 0 var(--border); display:flex; flex-direction:column; gap:10px; min-height:0; }
  .panel-title { font-size:clamp(16px,3.52vw,47px); font-weight:900; color:var(--border); text-align:center; margin-bottom:6px; }
  .btn { background:#fff; border:4px solid var(--border); border-radius:16px; padding:14px 16px; font-size:clamp(14px,2.88vw,36px); font-weight:900; color:var(--border); box-shadow:0 8px 0 var(--border); cursor:pointer; transition:transform .08s, box-shadow .08s; text-align:left; }
  .btn:hover { transform:translateY(-3px); box-shadow:0 11px 0 var(--border); }
  .btn:active { transform:translateY(6px); box-shadow:0 4px 0 var(--border); }
  .btn.correct { background:var(--green); color:#fff; pointer-events:none; }
  .btn.wrong { background:#ff9e9e; color:#5c1a1a; animation:shake .35s ease; pointer-events:none; }

  .controls { display:flex; gap:10px; justify-content:center; margin-top:8px; flex-wrap:wrap; }
  .next { background:var(--accent2); color:#fff; }
  .restart { background:var(--accent); color:#fff; }

  /* Progress */
  .progress { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-top:6px; }
  .dot { width:22px; height:22px; border-radius:50%; border:3px solid var(--border); background:#fff; box-shadow:0 4px 0 var(--border); }
  .dot.done { background:var(--green); }
  .dot.now { background:var(--accent); transform:scale(1.1); }

  /* Modal */
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; align-items:center; justify-content:center; z-index:500; }
  .modal.show { display:flex; }
  .m-card { background:var(--paper); border:5px solid var(--border); border-radius:24px; padding:36px 50px; box-shadow:0 16px 0 var(--border); text-align:center; max-width:90vw; animation:pop .35s ease; }
  @keyframes pop { from{transform:scale(.8);opacity:0} to{transform:scale(1);opacity:1} }
  .m-emoji { font-size:clamp(48px,8vw,80px); margin-bottom:8px; }
  .m-title { font-size:clamp(22px,3.2vw,36px); font-weight:900; color:var(--border); margin-bottom:6px; }
  .m-sub { font-size:clamp(15px,3.20vw,40px); color:var(--muted); font-weight:800; margin-bottom:16px; }
  .m-btns { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }

  /* Effects */
  .star { position:fixed; pointer-events:none; font-size:clamp(20px,3.5vw,40px); animation:starPop .8s ease-out forwards; z-index:999; }
  @keyframes starPop { 0%{transform:scale(0) rotate(0);opacity:1} 100%{transform:scale(1.6) rotate(200deg);opacity:0} }

</style>
</head>
<body>

<div id="start">
  <div class="cover">
    <div class="title">🍳 What a Delicious Meal!</div>
    <div class="subtitle">祈使句/顺序 — 高级挑战版</div>
    <div class="stickers">
      <div class="sticker">🥗</div><div class="sticker">🍝</div><div class="sticker">🍰</div>
    </div>
  </div>
  <div class="hint">点击打开食谱！</div>
</div>

<div id="ui">
  <div class="top">
    <div class="tag"><span class="lab">得分</span><span class="val" id="score">0</span></div>
    <div class="tag"><span class="lab">食谱</span><span class="val" id="step">1/10</span></div>
    <div class="tag"><span class="lab">连击</span><span class="val" id="combo">🔥 0</span></div>
  </div>

  <div class="board">
    <div class="recipe">
      <div class="recipe-title">
        <div class="emoji-big" id="stepEmoji">📝</div>
        <div class="title-text" id="stepTitle">Recipe</div>
      </div>
      <div class="content" id="content"></div>
      <div class="progress" id="progress"></div>
    </div>

    <div class="panel">
      <div class="panel-title">选择正确的表达</div>
      <div id="btns"></div>
      <div class="controls">
        <button class="btn next" id="nextBtn" style="display:none">下一个 →</button>
        <button class="btn restart" id="restartBtn">重新开始</button>
      </div>
    </div>
  </div>
</div>

<div class="modal" id="modal">
  <div class="m-card">
    <div class="m-emoji" id="mEmoji">🎊</div>
    <div class="m-title" id="mTitle">食谱完成！</div>
    <div class="m-sub" id="mSub">你得到 0 分！</div>
    <div class="m-btns">
      <button class="btn next" id="againBtn">再玩一次</button>
    </div>
  </div>
</div>

<script>
/* ===================== Sound ===================== */
class SoundEngine {
  constructor(){ this.ctx=null; this.ready=false; }
  init(){ if(this.ready) return; try{ this.ctx=new(window.AudioContext||window.webkitAudioContext)(); this.ready=true; }catch(e){} }
  play(type){
    if(!this.ctx) return; const now=this.ctx.currentTime;
    switch(type){
      case 'click': this.tone(700,0.06,'sine',0.08,now); break;
      case 'correct':
        this.tone(523,.12,'sine',.18,now); this.tone(659,.12,'sine',.18,now+.08); this.tone(784,.18,'sine',.18,now+.16); break;
      case 'win': [523,659,784,1047,784,1047].forEach((f,i)=>this.tone(f,.3,'sine',.14,now+i*.14)); break;
      case 'wrong':
        const o=this.ctx.createOscillator(),g=this.ctx.createGain(); o.connect(g); g.connect(this.ctx.destination); o.type='sawtooth'; o.frequency.setValueAtTime(200,now); o.frequency.linearRampToValueAtTime(100,now+.25); g.gain.setValueAtTime(.12,now); g.gain.exponentialRampToValueAtTime(.001,now+.25); o.start(now); o.stop(now+.25); break;
    }
  }
  tone(freq,dur,type,vol,t){
    const o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.connect(g); g.connect(this.ctx.destination); o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.start(t); o.stop(t+dur);
  }
}
const sound=new SoundEngine();

/* ===================== Data (High Difficulty) */
const STEPS = [
  {
    emoji:"🥚", title:"Scrambled Eggs",
    context:"你在学做炒鸡蛋，第一步是打蛋，第二步是加盐，第三步是下锅炒。",
    text:"First, <span class='gap' id='gap'></span> the eggs well. Then, <span class='gap' id='gap2'></span> some salt. Finally, cook them in a pan!",
    answer:"beat, add",
    opts:["beat, add","beats, adds","beating, adding","to beat, to add"]
  },
  {
    emoji:"🥗", title:"Fruit Salad",
    context:"你在做水果沙拉，先洗水果，再切一切，最后拌上沙拉酱。",
    text:"First, <span class='gap' id='gap'></span> the fruits carefully. Next, <span class='gap' id='gap2'></span> them into small pieces. Then mix with salad dressing!",
    answer:"wash, cut",
    opts:["wash, cut","washes, cuts","washing, cutting","to wash, to cut"]
  },
  {
    emoji:"🍜", title:"Noodles",
    context:"你在煮面条，先烧开水，再放面条，然后等几分钟，最后盛出来。",
    text:"First, <span class='gap' id='gap'></span> some water. Then, <span class='gap' id='gap2'></span> the noodles and wait a few minutes. Finally, serve!",
    answer:"boil, add",
    opts:["boil, add","boils, adds","boiling, adding","to boil, to add"]
  },
  {
    emoji:"🍞", title:"Toast",
    context:"你在做烤面包，先把面包放进烤箱，等2分钟，然后拿出来，最后抹上果酱。",
    text:"First, <span class='gap' id='gap'></span> the bread in the toaster. Wait 2 minutes, <span class='gap' id='gap2'></span> it out, and put on some jam!",
    answer:"put, take",
    opts:["put, take","puts, takes","putting, taking","to put, to take"]
  },
  {
    emoji:"🍰", title:"Cake (Class Recipe)",
    context:"你们班在写蛋糕食谱：先混合面粉和糖，再加鸡蛋和牛奶，然后放进烤箱。",
    text:"First, <span class='gap' id='gap'></span> flour and sugar. Then, <span class='gap' id='gap2'></span> eggs and milk. Finally, put it in the oven!",
    answer:"mix, add",
    opts:["mix, add","mixes, adds","mixing, adding","to mix, to add"]
  },
  {
    emoji:"🥤", title:"Lemonade",
    context:"你在做柠檬水，先切柠檬，再挤柠檬汁，然后加水和糖，最后加冰块。",
    text:"First, <span class='gap' id='gap'></span> the lemons. Then, <span class='gap' id='gap2'></span> the juice. Add water and sugar, then ice cubes!",
    answer:"cut, squeeze",
    opts:["cut, squeeze","cuts, squeezes","cutting, squeezing","to cut, to squeeze"]
  },
  {
    emoji:"🍳", title:"Fried Rice",
    context:"你在做蛋炒饭，先炒鸡蛋，再放米饭，然后加蔬菜，最后放盐和酱油。",
    text:"First, <span class='gap' id='gap'></span> the eggs. Then, <span class='gap' id='gap2'></span> the rice and vegetables. Finally, add salt and soy sauce!",
    answer:"cook, add",
    opts:["cook, add","cooks, adds","cooking, adding","to cook, to add"]
  },
  {
    emoji:"🥛", title:"Smoothie",
    context:"你在做奶昔，先把香蕉和草莓切好，再放进搅拌机，然后加牛奶，最后搅拌。",
    text:"First, <span class='gap' id='gap'></span> the banana and strawberries. Then, <span class='gap' id='gap2'></span> them in the blender. Add milk and blend!",
    answer:"cut, put",
    opts:["cut, put","cuts, puts","cutting, putting","to cut, to put"]
  },
  {
    emoji:"🥟", title:"Dumplings (Lab)",
    context:"你们在包饺子课上：先准备馅料，再放在饺子皮上，然后包起来，最后下锅煮。",
    text:"First, <span class='gap' id='gap'></span> the filling. Then, <span class='gap' id='gap2'></span> it on the wrapper, fold it, and cook!",
    answer:"prepare, put",
    opts:["prepare, put","prepares, puts","preparing, putting","to prepare, to put"]
  },
  {
    emoji:"🍪", title:"Cookies",
    context:"你和朋友写饼干食谱：先预热烤箱，再和面，然后分成小球，最后烤15分钟。",
    text:"First, <span class='gap' id='gap'></span> the oven. Then, <span class='gap' id='gap2'></span> the dough, make small balls, and bake for 15 minutes!",
    answer:"preheat, make",
    opts:["preheat, make","preheats, makes","preheating, making","to preheat, to make"]
  }
];

/* ===================== State */
let state = { step:0, score:0, combo:0, waiting:false };

/* ===================== DOM */
const startEl=document.getElementById('start');
const uiEl=document.getElementById('ui');
const scoreEl=document.getElementById('score');
const stepEl=document.getElementById('step');
const comboEl=document.getElementById('combo');
const stepEmojiEl=document.getElementById('stepEmoji');
const stepTitleEl=document.getElementById('stepTitle');
const contentEl=document.getElementById('content');
const btnsEl=document.getElementById('btns');
const nextBtn=document.getElementById('nextBtn');
const restartBtn=document.getElementById('restartBtn');
const progressEl=document.getElementById('progress');
const modal=document.getElementById('modal');
const mEmoji=document.getElementById('mEmoji');
const mTitle=document.getElementById('mTitle');
const mSub=document.getElementById('mSub');
const againBtn=document.getElementById('againBtn');

/* ===================== Init */
function init(){
  state={ step:0, score:0, combo:0, waiting:false };
  loadStep(0);
  updateUI();
}

function loadStep(stepIdx){
  const s=STEPS[stepIdx];
  stepEmojiEl.textContent=s.emoji;
  stepTitleEl.textContent=s.title;
  contentEl.innerHTML=`
    <div class="context">${s.context}</div>
    <div class="step">${s.text}</div>
  `;

  const shuffled=s.opts.slice().sort(()=>Math.random()-.5);
  btnsEl.innerHTML='';
  shuffled.forEach(o=>{
    const b=document.createElement('div'); b.className='btn'; b.textContent=o;
    b.addEventListener('click',()=>onChoice(o,b,s.answer));
    btnsEl.appendChild(b);
  });

  nextBtn.style.display='none';
  updateProgress();
  updateUI();
}

function onChoice(o,el,ans){
  if(state.waiting) return;
  state.waiting=true; sound.init();
  if(o===ans){
    el.classList.add('correct');
    state.combo++;
    let pts=10; if(state.combo>=3) pts=15; if(state.combo>=5) pts=20; state.score+=pts;
    sound.play('correct'); spawnStars(); updateUI();
    const gaps=contentEl.querySelectorAll('.gap');
    const parts=ans.split(', ');
    gaps.forEach((gap,i)=>{ if(parts[i]){ gap.textContent=parts[i]; gap.style.borderBottomColor='var(--green)'; gap.style.color='var(--green)'; } });
    setTimeout(()=>{ nextBtn.style.display='inline-flex'; state.waiting=false; },450);
  }else{
    el.classList.add('wrong'); state.combo=0; sound.play('wrong');
    setTimeout(()=>{
      const all=btnsEl.querySelectorAll('.btn');
      all.forEach(x=>{ if(x.textContent===ans) x.classList.add('correct'); });
      setTimeout(()=>{ nextBtn.style.display='inline-flex'; state.waiting=false; updateUI(); },500);
    },300);
  }
}

/* ===================== UI */
function updateUI(){
  scoreEl.textContent=state.score;
  stepEl.textContent=(state.step+1)+'/'+STEPS.length;
  comboEl.textContent='🔥 '+state.combo;
}

function updateProgress(){
  progressEl.innerHTML='';
  STEPS.forEach((d,i)=>{
    const el=document.createElement('div'); el.className='dot'+(i<state.step?' done':'')+(i===state.step?' now':'');
    progressEl.appendChild(el);
  });
}

function spawnStars(){
  const rect=contentEl.getBoundingClientRect();
  for(let i=0;i<12;i++){
    const s=document.createElement('div'); s.className='star';
    s.textContent=['⭐','✨','🌟','💫'][Math.floor(Math.random()*4)];
    s.style.left=(rect.left+Math.random()*rect.width)+'px';
    s.style.top=(rect.top+Math.random()*rect.height)+'px';
    document.body.appendChild(s); setTimeout(()=>s.remove(),800);
  }
}

function showModal(){
  mEmoji.textContent='🎊'; mTitle.textContent='食谱完成！'; mSub.textContent='你得到 '+state.score+' 分！';
  modal.classList.add('show');
}

/* ===================== Events */
startEl.addEventListener('click',()=>{
  sound.init(); sound.play('click');
  startEl.classList.add('hidden'); uiEl.style.display='flex'; init();
});

nextBtn.addEventListener('click',()=>{
  sound.init(); sound.play('click');
  state.step++;
  if(state.step>=STEPS.length){ setTimeout(()=>{ sound.play('win'); showModal(); },400); return; }
  loadStep(state.step);
});

restartBtn.addEventListener('click',()=>{
  sound.init(); sound.play('click'); init();
});

againBtn.addEventListener('click',()=>{
  sound.init(); sound.play('click'); modal.classList.remove('show'); init();
});

/* Shake keyframe */
const style=document.createElement('style');
style.textContent='@keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-10px)} 40%{transform:translateX(10px)} 60%{transform:translateX(-6px)} 80%{transform:translateX(6px)} }';
document.head.appendChild(style);

</script>
</body>
</html>

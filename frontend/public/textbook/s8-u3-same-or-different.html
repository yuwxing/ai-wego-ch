<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit 3 Same or Different — Compare Us!</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --bg:#f3f4ff; --paper:#f8f9ff; --border:#312e81; --accent:#6366f1;
    --accent2:#a5b4fc; --green:#22c55e; --muted:#64648f;
  }
  html,body { width:100%; height:100%; font-family:"Comic Sans MS","Comic Neue","PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); overflow:hidden; }

  /* Start */
  #start { position:fixed; inset:0; background:linear-gradient(135deg,#e0e7ff,#f3f4ff); z-index:1000; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; transition:opacity .6s; }
  #start.hidden { opacity:0; pointer-events:none; }
  .cover { background:var(--paper); border:5px solid var(--border); border-radius:24px; padding:40px 60px; box-shadow:0 14px 0 var(--border); text-align:center; transform:rotate(0.7deg); }
  .title { font-size:clamp(34px,6vw,60px); font-weight:900; color:var(--accent); margin-bottom:8px; }
  .subtitle { font-size:clamp(16px,2.5vw,28px); color:var(--border); font-weight:800; }
  .stickers { display:flex; gap:14px; justify-content:center; margin-top:18px; }
  .sticker { font-size:clamp(26px,4vw,44px); filter:drop-shadow(0 4px 0 rgba(0,0,0,.15)); animation:float 2.2s ease-in-out infinite; }
  .sticker:nth-child(2){ animation-delay:.25s }
  .sticker:nth-child(3){ animation-delay:.5s }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
  .hint { font-size:clamp(14px,2vw,22px); color:var(--muted); margin-top:28px; animation:pulse 1.6s infinite; }
  @keyframes pulse { 0%,100%{opacity:.6} 50%{opacity:1} }

  /* UI */
  #ui { width:100%; height:100%; display:none; flex-direction:column; padding:clamp(8px,1.2vh,16px) clamp(10px,1.8vw,28px); }
  .top { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:10px; }
  .tag { background:#fff; border:3px solid var(--border); border-radius:18px; padding:8px 16px; font-size:clamp(13px,1.8vw,20px); font-weight:800; box-shadow:0 6px 0 var(--border); display:flex; align-items:center; gap:8px; }
  .tag .lab { color:var(--muted); font-weight:700; }
  .tag .val { color:var(--accent); font-size:clamp(15px,2vw,24px); }

  /* Content */
  .board { flex:1; display:grid; grid-template-columns:1fr; gap:14px; min-height:0; }
  @media (min-width:1000px){ .board{grid-template-columns:1.15fr .85fr;} }

  .notebook { background:var(--paper); border:5px solid var(--border); border-radius:24px; padding:clamp(16px,2.2vw,34px); box-shadow:0 14px 0 var(--border); display:flex; flex-direction:column; min-height:0; overflow:auto; }
  .notebook-title { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .emoji-big { font-size:clamp(34px,5vw,54px); }
  .title-text { font-size:clamp(18px,2.6vw,30px); font-weight:900; color:var(--border); }
  .content { flex:1; display:flex; flex-direction:column; justify-content:center; gap:10px; }
  .page { background:#fff; border:4px solid var(--border); border-radius:16px; padding:14px 16px; font-size:clamp(14px,1.9vw,21px); font-weight:800; color:var(--border); box-shadow:0 8px 0 var(--border); line-height:1.55; }
  .context { font-size:clamp(12px,1.6vw,17px); color:var(--muted); margin-bottom:8px; font-weight:700; }
  .page .gap { display:inline-flex; align-items:center; justify-content:center; min-width:160px; border-bottom:4px solid var(--border); padding:0 8px; color:var(--accent); }

  .panel { background:var(--paper); border:5px solid var(--border); border-radius:24px; padding:clamp(16px,2.2vw,34px); box-shadow:0 14px 0 var(--border); display:flex; flex-direction:column; gap:10px; min-height:0; }
  .panel-title { font-size:clamp(16px,2.2vw,26px); font-weight:900; color:var(--border); text-align:center; margin-bottom:6px; }
  .btn { background:#fff; border:4px solid var(--border); border-radius:16px; padding:14px 16px; font-size:clamp(14px,1.8vw,20px); font-weight:900; color:var(--border); box-shadow:0 8px 0 var(--border); cursor:pointer; transition:transform .08s, box-shadow .08s; text-align:left; }
  .btn:hover { transform:translateY(-3px); box-shadow:0 11px 0 var(--border); }
  .btn:active { transform:translateY(6px); box-shadow:0 4px 0 var(--border); }
  .btn.correct { background:var(--green); color:#fff; pointer-events:none; }
  .btn.wrong { background:#ff9e9e; color:#5c1a1a; animation:shake .35s ease; pointer-events:none; }

  .controls { display:flex; gap:10px; justify-content:center; margin-top:8px; flex-wrap:wrap; }
  .next { background:var(--accent2); color:#fff; }
  .restart { background:var(--accent); color:#fff; }

  /* Progress */
  .progress { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-top:6px; }
  .dot { width:22px; height:22px; border-radius:50%; border:3px solid var(--border); background:#fff; box-shadow:0 4px 0 var(--border); }
  .dot.done { background:var(--green); }
  .dot.now { background:var(--accent); transform:scale(1.1); }

  /* Modal */
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; align-items:center; justify-content:center; z-index:500; }
  .modal.show { display:flex; }
  .m-card { background:var(--paper); border:5px solid var(--border); border-radius:24px; padding:36px 50px; box-shadow:0 16px 0 var(--border); text-align:center; max-width:90vw; animation:pop .35s ease; }
  @keyframes pop { from{transform:scale(.8);opacity:0} to{transform:scale(1);opacity:1} }
  .m-emoji { font-size:clamp(48px,8vw,80px); margin-bottom:8px; }
  .m-title { font-size:clamp(22px,3.2vw,36px); font-weight:900; color:var(--border); margin-bottom:6px; }
  .m-sub { font-size:clamp(15px,2vw,22px); color:var(--muted); font-weight:800; margin-bottom:16px; }
  .m-btns { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }

  /* Effects */
  .star { position:fixed; pointer-events:none; font-size:clamp(20px,3.5vw,40px); animation:starPop .8s ease-out forwards; z-index:999; }
  @keyframes starPop { 0%{transform:scale(0) rotate(0);opacity:1} 100%{transform:scale(1.6) rotate(200deg);opacity:0} }

</style>
</head>
<body>

<div id="start">
  <div class="cover">
    <div class="title">👭 Same or Different?</div>
    <div class="subtitle">比较级/最高级 — 高级挑战版</div>
    <div class="stickers">
      <div class="sticker">🔵</div><div class="sticker">🔴</div><div class="sticker">🟡</div>
    </div>
  </div>
  <div class="hint">点击翻开比较本！</div>
</div>

<div id="ui">
  <div class="top">
    <div class="tag"><span class="lab">得分</span><span class="val" id="score">0</span></div>
    <div class="tag"><span class="lab">页面</span><span class="val" id="page">1/10</span></div>
    <div class="tag"><span class="lab">连击</span><span class="val" id="combo">🔥 0</span></div>
  </div>

  <div class="board">
    <div class="notebook">
      <div class="notebook-title">
        <div class="emoji-big" id="pageEmoji">📝</div>
        <div class="title-text" id="pageTitle">Compare Us</div>
      </div>
      <div class="content" id="content"></div>
      <div class="progress" id="progress"></div>
    </div>

    <div class="panel">
      <div class="panel-title">选择正确的表达</div>
      <div id="btns"></div>
      <div class="controls">
        <button class="btn next" id="nextBtn" style="display:none">下一个 →</button>
        <button class="btn restart" id="restartBtn">重新开始</button>
      </div>
    </div>
  </div>
</div>

<div class="modal" id="modal">
  <div class="m-card">
    <div class="m-emoji" id="mEmoji">🎊</div>
    <div class="m-title" id="mTitle">比较本完成！</div>
    <div class="m-sub" id="mSub">你得到 0 分！</div>
    <div class="m-btns">
      <button class="btn next" id="againBtn">再玩一次</button>
    </div>
  </div>
</div>

<script>
/* ===================== Sound ===================== */
class SoundEngine {
  constructor(){ this.ctx=null; this.ready=false; }
  init(){ if(this.ready) return; try{ this.ctx=new(window.AudioContext||window.webkitAudioContext)(); this.ready=true; }catch(e){} }
  play(type){
    if(!this.ctx) return; const now=this.ctx.currentTime;
    switch(type){
      case 'click': this.tone(700,0.06,'sine',0.08,now); break;
      case 'correct':
        this.tone(523,.12,'sine',.18,now); this.tone(659,.12,'sine',.18,now+.08); this.tone(784,.18,'sine',.18,now+.16); break;
      case 'win': [523,659,784,1047,784,1047].forEach((f,i)=>this.tone(f,.3,'sine',.14,now+i*.14)); break;
      case 'wrong':
        const o=this.ctx.createOscillator(),g=this.ctx.createGain(); o.connect(g); g.connect(this.ctx.destination); o.type='sawtooth'; o.frequency.setValueAtTime(200,now); o.frequency.linearRampToValueAtTime(100,now+.25); g.gain.setValueAtTime(.12,now); g.gain.exponentialRampToValueAtTime(.001,now+.25); o.start(now); o.stop(now+.25); break;
    }
  }
  tone(freq,dur,type,vol,t){
    const o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.connect(g); g.connect(this.ctx.destination); o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.start(t); o.stop(t+dur);
  }
}
const sound=new SoundEngine();

/* ===================== Data (High Difficulty) */
const PAGES = [
  {
    emoji:"🏃", title:"Sports Day",
    context:"运动会上你和朋友比赛跑步，Tom跑得最快，你第二快，Mike最慢。",
    text:"Tom is <span class='gap' id='gap'></span> runner in our class — he runs <span class='gap' id='gap2'></span> than anyone else. I'm second, and Mike is the slowest.",
    answer:"the fastest, faster",
    opts:["the fastest, faster","fastest, more fast","the faster, faster","fastest, faster"]
  },
  {
    emoji:"📚", title:"Midterm Exam",
    context:"这次英语考试很难，你的成绩比上次好，但Lisa是全班最好的。",
    text:"This exam was <span class='gap' id='gap'></span> the last one, but I did <span class='gap' id='gap2'></span> than before. Lisa got the best score in our class.",
    answer:"more difficult than, better",
    opts:["more difficult than, better","difficult than, more good","more difficult as, better","difficulter than, better"]
  },
  {
    emoji:"🎨", title:"Art Competition",
    context:"你、Lily和Jessica参加绘画比赛，Lily的画最有创意，Jessica的最漂亮。",
    text:"Lily's painting is <span class='gap' id='gap'></span>, and Jessica's is <span class='gap' id='gap2'></span> of the three. I like both!",
    answer:"the most creative, the most beautiful",
    opts:["the most creative, the most beautiful","creativeest, beautifulest","most creative, most beautiful","the creativest, the beautifulest"]
  },
  {
    emoji:"🎮", title:"Video Games",
    context:"你和弟弟玩电子游戏，你通常打得更认真，但他今天运气更好。",
    text:"I usually play <span class='gap' id='gap'></span> than my brother, but today he played <span class='gap' id='gap2'></span> and won more games.",
    answer:"more carefully, luckier",
    opts:["more carefully, luckier","carefuler, more lucky","more careful, luckier","carefully, more lucky"]
  },
  {
    emoji:"🎬", title:"Movie Night",
    context:"你们看了三部电影：喜剧片最有趣，动作片最刺激，纪录片最无聊。",
    text:"The comedy was <span class='gap' id='gap'></span>, the action movie was <span class='gap' id='gap2'></span>, and the documentary was the most boring.",
    answer:"the funniest, the most exciting",
    opts:["the funniest, the most exciting","funniest, most exciting","the most funny, the most exciting","funnier, exciting"]
  },
  {
    emoji:"📱", title:"Smartphones",
    context:"你比较三款手机：A最贵，B最便宜，C屏幕最大。",
    text:"Phone A is <span class='gap' id='gap'></span>, Phone B is <span class='gap' id='gap2'></span>, and Phone C has the biggest screen.",
    answer:"the most expensive, the cheapest",
    opts:["the most expensive, the cheapest","expensivest, cheapest","most expensive, cheapest","the expensivest, the cheap"]
  },
  {
    emoji:"🏖️", title:"Summer Vacation",
    context:"你对比去年和今年的暑假：今年更热但玩得更开心。",
    text:"This summer was <span class='gap' id='gap'></span> last year, but I enjoyed it <span class='gap' id='gap2'></span>.",
    answer:"hotter than, more",
    opts:["hotter than, more","more hot than, much","hotter as, more","more hotter than, more"]
  },
  {
    emoji:"😴", title:"Monday Morning",
    context:"周一早上你比平时更困，因为昨晚睡得比平时晚很多。",
    text:"I feel <span class='gap' id='gap'></span> this morning because I went to bed <span class='gap' id='gap2'></span> than usual last night.",
    answer:"sleepier, much later",
    opts:["sleepier, much later","more sleepy, more late","sleepyer, later","more sleepier, much later"]
  },
  {
    emoji:"🎒", title:"School Bags",
    context:"你们三个的书包都很重：你的比Lily的重，但Lisa的是三个中最重的。",
    text:"My bag is <span class='gap' id='gap'></span> Lily's, but Lisa's is <span class='gap' id='gap2'></span> of the three — hers is huge!",
    answer:"heavier than, the heaviest",
    opts:["heavier than, the heaviest","more heavy than, heaviest","heavier as, the most heavy","more heavier than, heaviest"]
  },
  {
    emoji:"🎯", title:"Who is the Best?",
    context:"老师问你班上谁最友好、最聪明、最有趣，你回答了这三个问题。",
    text:"I think Tina is <span class='gap' id='gap'></span>, Bob is <span class='gap' id='gap2'></span>, and Jason is the funniest in our class.",
    answer:"the friendliest, the smartest",
    opts:["the friendliest, the smartest","friendliest, smartest","the most friendly, the most smart","friendlier, smarter"]
  }
];

/* ===================== State */
let state = { page:0, score:0, combo:0, waiting:false };

/* ===================== DOM */
const startEl=document.getElementById('start');
const uiEl=document.getElementById('ui');
const scoreEl=document.getElementById('score');
const pageEl=document.getElementById('page');
const comboEl=document.getElementById('combo');
const pageEmojiEl=document.getElementById('pageEmoji');
const pageTitleEl=document.getElementById('pageTitle');
const contentEl=document.getElementById('content');
const btnsEl=document.getElementById('btns');
const nextBtn=document.getElementById('nextBtn');
const restartBtn=document.getElementById('restartBtn');
const progressEl=document.getElementById('progress');
const modal=document.getElementById('modal');
const mEmoji=document.getElementById('mEmoji');
const mTitle=document.getElementById('mTitle');
const mSub=document.getElementById('mSub');
const againBtn=document.getElementById('againBtn');

/* ===================== Init */
function init(){
  state={ page:0, score:0, combo:0, waiting:false };
  loadPage(0);
  updateUI();
}

function loadPage(pageIdx){
  const p=PAGES[pageIdx];
  pageEmojiEl.textContent=p.emoji;
  pageTitleEl.textContent=p.title;
  contentEl.innerHTML=`
    <div class="context">${p.context}</div>
    <div class="page">${p.text}</div>
  `;

  const shuffled=p.opts.slice().sort(()=>Math.random()-.5);
  btnsEl.innerHTML='';
  shuffled.forEach(o=>{
    const b=document.createElement('div'); b.className='btn'; b.textContent=o;
    b.addEventListener('click',()=>onChoice(o,b,p.answer));
    btnsEl.appendChild(b);
  });

  nextBtn.style.display='none';
  updateProgress();
  updateUI();
}

function onChoice(o,el,ans){
  if(state.waiting) return;
  state.waiting=true; sound.init();
  if(o===ans){
    el.classList.add('correct');
    state.combo++;
    let pts=10; if(state.combo>=3) pts=15; if(state.combo>=5) pts=20; state.score+=pts;
    sound.play('correct'); spawnStars(); updateUI();
    const gaps=contentEl.querySelectorAll('.gap');
    const parts=ans.split(', ');
    gaps.forEach((gap,i)=>{ if(parts[i]){ gap.textContent=parts[i]; gap.style.borderBottomColor='var(--green)'; gap.style.color='var(--green)'; } });
    setTimeout(()=>{ nextBtn.style.display='inline-flex'; state.waiting=false; },450);
  }else{
    el.classList.add('wrong'); state.combo=0; sound.play('wrong');
    setTimeout(()=>{
      const all=btnsEl.querySelectorAll('.btn');
      all.forEach(x=>{ if(x.textContent===ans) x.classList.add('correct'); });
      setTimeout(()=>{ nextBtn.style.display='inline-flex'; state.waiting=false; updateUI(); },500);
    },300);
  }
}

/* ===================== UI */
function updateUI(){
  scoreEl.textContent=state.score;
  pageEl.textContent=(state.page+1)+'/'+PAGES.length;
  comboEl.textContent='🔥 '+state.combo;
}

function updateProgress(){
  progressEl.innerHTML='';
  PAGES.forEach((d,i)=>{
    const el=document.createElement('div'); el.className='dot'+(i<state.page?' done':'')+(i===state.page?' now':'');
    progressEl.appendChild(el);
  });
}

function spawnStars(){
  const rect=contentEl.getBoundingClientRect();
  for(let i=0;i<12;i++){
    const s=document.createElement('div'); s.className='star';
    s.textContent=['⭐','✨','🌟','💫'][Math.floor(Math.random()*4)];
    s.style.left=(rect.left+Math.random()*rect.width)+'px';
    s.style.top=(rect.top+Math.random()*rect.height)+'px';
    document.body.appendChild(s); setTimeout(()=>s.remove(),800);
  }
}

function showModal(){
  mEmoji.textContent='🎊'; mTitle.textContent='比较本完成！'; mSub.textContent='你得到 '+state.score+' 分！';
  modal.classList.add('show');
}

/* ===================== Events */
startEl.addEventListener('click',()=>{
  sound.init(); sound.play('click');
  startEl.classList.add('hidden'); uiEl.style.display='flex'; init();
});

nextBtn.addEventListener('click',()=>{
  sound.init(); sound.play('click');
  state.page++;
  if(state.page>=PAGES.length){ setTimeout(()=>{ sound.play('win'); showModal(); },400); return; }
  loadPage(state.page);
});

restartBtn.addEventListener('click',()=>{
  sound.init(); sound.play('click'); init();
});

againBtn.addEventListener('click',()=>{
  sound.init(); sound.play('click'); modal.classList.remove('show'); init();
});

/* Shake keyframe */
const style=document.createElement('style');
style.textContent='@keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-10px)} 40%{transform:translateX(10px)} 60%{transform:translateX(-6px)} 80%{transform:translateX(6px)} }';
document.head.appendChild(style);

</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>八上 Unit 8 - Let's Communicate</title>
<style>
*{box-sizing:border-box}
body{
    margin:0;
    font-family:'Georgia',serif;
    background:#fef7ed;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    color:#292522
}
.container{
    width:100%;
    max-width:880px;
    background:#fff;
    border-radius:22px;
    box-shadow:0 22px 70px rgba(0,0,0,.18);
    overflow:hidden;
    position:relative
}
.header{
    background:linear-gradient(135deg,#f97316,#ea580c);
    color:#fff;
    padding:26px 24px;
    text-align:center;
    position:relative
}
.header h1{
    margin:0;
    font-size:28px;
    letter-spacing:1px
}
.header p{
    margin:8px 0 0;
    opacity:.92
}
.deco{
    position:absolute;
    bottom:-10px;
    left:50%;
    transform:translateX(-50%);
    font-size:36px;
    opacity:.3
}
.game-wrapper{
    padding:30px
}
.progress{
    display:flex;
    gap:10px;
    justify-content:center;
    margin-bottom:22px
}
.dot{
    width:12px;
    height:12px;
    border-radius:50%;
    background:#e7e5e4;
    transition:.3s
}
.dot.active{
    background:#f97316;
    box-shadow:0 0 12px rgba(249,115,22,.45)
}
.dot.done{
    background:#16a34a
}
.scoreboard{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px 20px;
    background:#fff7ed;
    border:1px dashed #fed7aa;
    border-radius:14px;
    margin-bottom:22px
}
.score{
    font-weight:700;
    font-size:30px;
    color:#1c1917
}
.story-so-far{
    font-size:26px;
    color:#78716c
}
.panel{
    background:linear-gradient(180deg,#fff7ed,#fff);
    border:2px dashed #fed7aa;
    border-radius:18px;
    padding:28px;
    text-align:center;
    min-height:260px;
    display:flex;
    flex-direction:column;
    justify-content:center
}
.scene{
    font-size:52px;
    margin-bottom:16px
}
.question{
    font-size:36px;
    margin-bottom:22px;
    line-height:1.6
}
.options{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:14px
}
.btn{
    padding:16px 18px;
    font-size:30px;
    border:2px solid #fed7aa;
    border-radius:14px;
    background:#fff;
    cursor:pointer;
    transition:.2s;
    font-weight:600;
    font-family:system-ui
}
.btn:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 24px rgba(0,0,0,.1);
    border-color:#f97316;
    background:#fff7ed
}
.btn.correct{
    background:#dcfce7;
    border-color:#22c55e;
    color:#166534
}
.btn.wrong{
    background:#fee2e2;
    border-color:#ef4444;
    color:#991b1b;
    animation:shake .4s
}
@keyframes shake{
    0%,100%{transform:translateX(0)}
    25%{transform:translateX(-6px)}
    75%{transform:translateX(6px)}
}
.start-screen, .end-screen{
    text-align:center;
    padding:34px
}
.book{
    display:flex;
    justify-content:center;
    gap:20px;
    margin:20px 0;
    flex-wrap:wrap
}
.page{
    width:80px;
    height:90px;
    border-radius:12px;
    background:#fff;
    box-shadow:0 6px 18px rgba(0,0,0,.12);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:34px;
    animation:flip 3s ease-in-out infinite
}
.page:nth-child(2){animation-delay:.5s}
.page:nth-child(3){animation-delay:1s}
@keyframes flip{
    0%,100%{transform:rotateY(0)}
    50%{transform:rotateY(18deg)}
}
.big-btn{
    margin-top:18px;
    padding:16px 34px;
    font-size:32px;
    border:none;
    border-radius:14px;
    background:linear-gradient(135deg,#f97316,#ea580c);
    color:#fff;
    cursor:pointer;
    font-weight:700;
    transition:.25s;
    box-shadow:0 12px 30px rgba(249,115,22,.35)
}
.big-btn:hover{transform:translateY(-3px) scale(1.02)}
.hidden{display:none}

/* === classroom projection font boost (added) === */
.container{max-width:1200px}
.header h1{font-size:52px}
.header p{font-size:28px}
.start-screen h2{font-size:44px}
.start-screen p{font-size:24px}
.start-screen .big-btn{font-size:36px}
.end-screen h2{font-size:40px}
.end-screen p{font-size:26px}
.end-screen .big-btn{font-size:36px}
.question{font-size:44px}
.btn{font-size:34px}
.options{display:flex;flex-direction:column;gap:14px}
.score{font-size:36px}
.combo{font-size:30px}
.story-so-far{font-size:32px}
.page{font-size:44px}
.big-btn{font-size:34px}

</style>
</head>
<body>
<div class="container">
    <div class="header">
        <span class="deco">📖</span>
        <h1>Unit 8 🧭 Let's Communicate</h1>
        <p>Grammar: if clauses — 第一条件句</p>
    </div>
    <div class="game-wrapper">
        <div id="start" class="start-screen">
            <div class="book">
                <div class="page">🏔️</div><div class="page">🗺️</div><div class="page">🧭</div>
            </div>
            <h2>Choose Your Adventure</h2>
            <p>Complete the if sentences to decide what happens next!</p>
            <button class="big-btn" id="startBtn">Start Adventure</button>
        </div>
        <div id="game" class="hidden">
            <div class="progress" id="progress"></div>
            <div class="scoreboard">
                <div class="score">Score: <span id="score">0</span></div>
                <div class="story-so-far">Pages: <span id="page">1</span>/10</div>
            </div>
            <div class="panel">
                <div class="scene" id="scene">🏕️</div>
                <div class="question" id="qText"></div>
                <div class="options" id="options"></div>
            </div>
        </div>
        <div id="end" class="end-screen hidden">
            <h2>🎊 Adventure Complete!</h2>
            <p>Your final score: <strong id="final"></strong></p>
            <p>You mastered conditional sentences!</p>
            <button class="big-btn" id="again">Play Again</button>
        </div>
    </div>
</div>
<script>
class SoundEngine{
    constructor(){
        this.ctx=null
    }
    init(){
        if(!this.ctx) this.ctx=new (window.AudioContext||window.webkitAudioContext)()
    }
    play(type){
        this.init();
        const o=this.ctx.createOscillator(),g=this.ctx.createGain();
        o.connect(g);g.connect(this.ctx.destination);
        const now=this.ctx.currentTime;
        switch(type){
            case 'click':
                o.frequency.value=620;g.gain.setValueAtTime(.2,now);g.gain.exponentialRampToValueAtTime(.01,now+.1);o.start(now);o.stop(now+.1);break;
            case 'correct':
                o.frequency.value=523;g.gain.setValueAtTime(.25,now);o.start(now);
                setTimeout(()=>{o.frequency.value=659},100);
                setTimeout(()=>{o.frequency.value=784},200);
                g.gain.exponentialRampToValueAtTime(.01,now+.4);o.stop(now+.4);break;
            case 'wrong':
                o.type='sawtooth';o.frequency.value=190;g.gain.setValueAtTime(.18,now);g.gain.exponentialRampToValueAtTime(.01,now+.3);o.start(now);o.stop(now+.3);break;
            case 'win':
                [523,587,659,784,880,1047].forEach((f,i)=>{
                    const o2=this.ctx.createOscillator(),g2=this.ctx.createGain();
                    o2.connect(g2);g2.connect(this.ctx.destination);
                    o2.frequency.value=f;g2.gain.setValueAtTime(.18,now+i*.12);g2.gain.exponentialRampToValueAtTime(.01,now+i*.12+.22);
                    o2.start(now+i*.12);o2.stop(now+i*.12+.22)
                })
        }
    }
}
const sound=new SoundEngine();
const scenes=["🏕️","🌧️","🗺️","🏃","🌉","🍎","🏠","🎪","🚀","🎇"];
const questions=[
    {q:"If it ____ sunny, we ____ hiking.",opts:["is / will go","will be / go","is / go","will be / will go"],a:0},
    {q:"What ____ you do if you ____ lost?",opts:["will / get","do / will get","will / will get","do / get"],a:0},
    {q:"If we ____ a map, we ____ find the way.",opts:["will have / will","have / will","will have /","have /"],a:1},
    {q:"If you ____ fast, you ____ catch the bus.",opts:["will run /","run / will","will run / will","run /"],a:1},
    {q:"____ you call me if you ____ any trouble?",opts:["Will / have","Do / will have","Will / will have","Do / have"],a:0},
    {q:"If it ____, we ____ at home.",opts:["rains / will stay","will rain / stay","rains / stay","will rain / will stay"],a:0},
    {q:"We ____ happy if you ____.",opts:["are / will come","will be / come","are / come","will be / will come"],a:1},
    {q:"If she ____ hard, she ____ the test.",opts:["will study / passes","studies / will pass","will study / will pass","studies / passes"],a:1},
    {q:"What ____ if I ____ this button?",opts:["happens / press","will happen / press","happens / will press","will happen / will press"],a:1},
    {q:"They ____ to the party if we ____ them.",opts:["come / will invite","will come / invite","come / invite","will come / will invite"],a:1}
];
let idx=0,score=0;
const progress=document.getElementById('progress');
const qText=document.getElementById('qText');
const options=document.getElementById('options');
const sceneEl=document.getElementById('scene');
const scoreEl=document.getElementById('score');
const pageEl=document.getElementById('page');
const start=document.getElementById('start');
const game=document.getElementById('game');
const end=document.getElementById('end');
const final=document.getElementById('final');
function renderProgress(){
    progress.innerHTML='';
    for(let i=0;i<questions.length;i++){
        const d=document.createElement('div');
        d.className='dot';
        if(i<idx) d.classList.add('done');
        if(i===idx) d.classList.add('active');
        progress.appendChild(d)
    }
}
function renderQ(){
    renderProgress();
    const q=questions[idx];
    sceneEl.textContent=scenes[idx];
    qText.textContent=q.q;
    options.innerHTML='';
    q.opts.forEach((opt,i)=>{
        const b=document.createElement('button');
        b.className='btn';
        b.textContent=opt;
        b.onclick=()=>choose(i);
        options.appendChild(b)
    })
}
function choose(i){
    sound.play('click');
    const q=questions[idx];
    const btns=options.querySelectorAll('.btn');
    btns.forEach(b=>b.disabled=true);
    if(i===q.a){
        btns[i].classList.add('correct');
        sound.play('correct');
        score+=12
    }else{
        btns[i].classList.add('wrong');
        btns[q.a].classList.add('correct');
        sound.play('wrong')
    }
    scoreEl.textContent=score;
    pageEl.textContent=idx+2;
    setTimeout(()=>{
        idx++;
        if(idx<questions.length) renderQ();
        else showEnd()
    },900)
}
function showEnd(){
    game.classList.add('hidden');
    end.classList.remove('hidden');
    final.textContent=score;
    sound.play('win')
}
document.getElementById('startBtn').onclick=()=>{
    sound.play('click');
    start.classList.add('hidden');
    game.classList.remove('hidden');
    renderQ()
};
document.getElementById('again').onclick=()=>{
    sound.play('click');
    idx=0;score=0;
    scoreEl.textContent=0;pageEl.textContent=1;
    end.classList.add('hidden');
    start.classList.remove('hidden')
};
</script>
</body>
</html>

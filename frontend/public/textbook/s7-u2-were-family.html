<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit 2 - We're Family - LEGO Family Adventure!</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --bg:#f8f9fa; --grid:#e9ecef;
    --lego-red:#e32121; --lego-blue:#006cb7; --lego-yellow:#ffd400; --lego-green:#009640;
    --lego-orange:#ff7d00; --lego-purple:#97007d;
    --text:#1c1c1e; --muted:#8e8e93;
  }
  html,body { width:100%; height:100%; font-family:"Comic Sans MS","Comic Neue","PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); overflow:hidden; }

  /* Start */
  #start { position:fixed; inset:0; background:linear-gradient(135deg,#009640,#3fc070); z-index:1000; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; transition:opacity .6s; color:#fff; }
  #start.hidden { opacity:0; pointer-events:none; }
  .logo { font-size:clamp(60px,10vw,120px); font-weight:900; letter-spacing:4px; color:#fff; margin-bottom:10px; text-shadow:6px 6px 0 #006b2e; transform:skewX(-6deg); }
  .st { font-size:clamp(20px,3vw,40px); font-weight:800; color:#fff; margin-bottom:24px; }
  .blocks { display:flex; gap:10px; margin-bottom:20px; }
  .t-block { width:clamp(40px,7vw,80px); height:clamp(40px,7vw,80px); background:var(--lego-yellow); border-radius:10px; position:relative; display:flex; align-items:center; justify-content:center; box-shadow:inset 0 -8px 0 rgba(0,0,0,.18), inset 0 8px 0 rgba(255,255,255,.2), 0 12px 0 #c7a100,0 18px 20px rgba(0,0,0,.25); animation:bounce 1.2s infinite; }
  .t-block.red { background:var(--lego-red); animation-delay:.15s; box-shadow:inset 0 -8px 0 rgba(0,0,0,.18), inset 0 8px 0 rgba(255,255,255,.2), 0 12px 0 #b51a1a,0 18px 20px rgba(0,0,0,.25); }
  .t-block.blue { background:var(--lego-blue); animation-delay:.3s; box-shadow:inset 0 -8px 0 rgba(0,0,0,.18), inset 0 8px 0 rgba(255,255,255,.2), 0 12px 0 #004f83,0 18px 20px rgba(0,0,0,.25); }
  .t-block.green { background:var(--lego-green); animation-delay:.45s; box-shadow:inset 0 -8px 0 rgba(0,0,0,.18), inset 0 8px 0 rgba(255,255,255,.2), 0 12px 0 #006b2e,0 18px 20px rgba(0,0,0,.25); }
  .t-block::after { content:''; width:50%; height:50%; border:3px solid rgba(255,255,255,.35); border-radius:50%; box-shadow:inset 0 2px 0 rgba(255,255,255,.3); }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-14px)} }
  .hint { font-size:clamp(16px,2vw,24px); color:rgba(255,255,255,.7); margin-top:20px; animation:pulse 1.6s infinite; }
  @keyframes pulse { 0%,100%{opacity:.6} 50%{opacity:1} }

  /* UI */
  #ui { width:100%; height:100%; display:none; flex-direction:column; padding:clamp(10px,1.5vh,20px) clamp(10px,2vw,30px); }
  .top { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:10px; }
  .chip { background:#fff; border:3px solid #000; border-radius:14px; padding:clamp(6px,1vh,12px) clamp(14px,2vw,24px); font-size:clamp(14px,1.8vw,22px); font-weight:800; box-shadow:0 6px 0 #000; display:flex; align-items:center; gap:8px; }
  .chip .lab { color:#8e8e93; font-weight:600; }
  .chip .val { color:var(--lego-red); font-size:clamp(18px,2.5vw,30px); }

  /* Game area */
  .game { flex:1; display:grid; grid-template-columns:1fr; gap:clamp(12px,2vw,28px); min-height:0; }
  @media (min-width:1000px){ .game{grid-template-columns:1.2fr .8fr;} }

  /* Board */
  .board { background:#fff; border:4px solid #000; border-radius:18px; padding:clamp(14px,2vw,28px); box-shadow:0 12px 0 #000; display:flex; flex-direction:column; min-height:0; }
  .board-title { font-size:clamp(16px,2.2vw,26px); font-weight:900; margin-bottom:12px; text-align:center; }
  .track { display:grid; grid-template-columns:repeat(8,1fr); gap:8px; align-content:center; height:100%; overflow:auto; }
  .cell { background:#f8f9fa; border:3px solid #000; border-radius:14px; padding:10px 6px; font-size:clamp(12px,1.5vw,16px); font-weight:800; box-shadow:0 8px 0 #000; text-align:center; display:flex; flex-direction:column; gap:4px; align-items:center; justify-content:center; }
  .cell .emoji { font-size:clamp(18px,2.5vw,28px); }
  .cell.here { background:var(--lego-yellow); transform:translateY(-4px); box-shadow:0 12px 0 #000; }
  .cell.done { background:var(--lego-green); color:#fff; pointer-events:none; }

  /* Panel */
  .panel { background:#fff; border:4px solid #000; border-radius:18px; padding:clamp(14px,2vw,28px); box-shadow:0 12px 0 #000; display:flex; flex-direction:column; gap:12px; min-height:0; }
  .panel-title { font-size:clamp(16px,2.2vw,26px); font-weight:900; text-align:center; }
  .q { background:#f8f9fa; border:3px solid #000; border-radius:14px; padding:14px; font-size:clamp(14px,1.8vw,20px); font-weight:800; }
  .opts { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
  .opt { background:#f8f9fa; border:3px solid #000; border-radius:14px; padding:10px; font-size:clamp(13px,1.7vw,18px); font-weight:800; box-shadow:0 8px 0 #000; cursor:pointer; text-align:center; }
  .opt:hover { transform:translateY(-2px); }
  .opt:active { transform:translateY(4px); box-shadow:0 4px 0 #000; }
  .opt.correct { background:var(--lego-green); color:#fff; pointer-events:none; }
  .opt.wrong { background:var(--lego-red); color:#fff; animation:shake .35s ease; pointer-events:none; }

  /* Lego */
  .lego { position:relative; display:flex; align-items:center; justify-content:center; padding:clamp(10px,1.4vh,16px) clamp(18px,2.4vw,32px); font-size:clamp(14px,1.8vw,22px); font-weight:900; color:#fff; border:none; cursor:pointer; border-radius:12px; box-shadow:inset 0 -10px 0 rgba(0,0,0,.18), inset 0 10px 0 rgba(255,255,255,.18), 0 10px 0 #000; transition:transform .08s, box-shadow .08s, opacity .2s; }
  .lego:hover { transform:translateY(-3px); }
  .lego:active { transform:translateY(6px); box-shadow:inset 0 -10px 0 rgba(0,0,0,.18), inset 0 10px 0 rgba(255,255,255,.18), 0 4px 0 #000; }
  .lego.red { background:var(--lego-red); }
  .lego.blue { background:var(--lego-blue); }
  .lego.yellow { background:var(--lego-yellow); color:#000; }
  .lego.green { background:var(--lego-green); }
  .lego.orange { background:var(--lego-orange); }
  .lego.purple { background:var(--lego-purple); }
  .lego:disabled { opacity:.5; cursor:not-allowed; transform:translateY(4px); box-shadow:inset 0 -10px 0 rgba(0,0,0,.18), inset 0 10px 0 rgba(255,255,255,.18), 0 4px 0 #000; }
  .studs { position:absolute; top:-8px; left:50%; transform:translateX(-50%); display:flex; gap:8px; }
  .stud { width:16px; height:12px; border-radius:6px 6px 0 0; background:inherit; border:3px solid rgba(0,0,0,.12); border-bottom:none; box-shadow:inset 0 2px 0 rgba(255,255,255,.25); }

  /* Dice animation */
  .dice { display:inline-block; font-size:clamp(28px,4vw,48px); }
  .dice.roll { animation:dice .6s ease-in-out; }
  @keyframes dice {
    0%{transform:rotate(0deg) scale(1)}
    25%{transform:rotate(-15deg) scale(1.15)}
    50%{transform:rotate(10deg) scale(.95)}
    75%{transform:rotate(-8deg) scale(1.05)}
    100%{transform:rotate(0deg) scale(1)}
  }

  /* Controls */
  .bottom { display:flex; justify-content:center; gap:12px; margin-top:10px; }

  /* Modal */
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.5); display:none; align-items:center; justify-content:center; z-index:500; }
  .modal.show { display:flex; }
  .m-card { background:#fff; border:5px solid #000; border-radius:20px; padding:30px 40px; box-shadow:0 18px 0 #000; text-align:center; max-width:90vw; animation:scaleIn .3s cubic-bezier(.175,.885,.32,1.275); }
  @keyframes scaleIn { from{transform:scale(.8);opacity:0} to{transform:scale(1);opacity:1} }
  .m-emoji { font-size:clamp(50px,8vw,80px); margin-bottom:10px; }
  .m-title { font-size:clamp(24px,3.5vw,40px); font-weight:900; color:#000; margin-bottom:8px; }
  .m-sub { font-size:clamp(16px,2vw,24px); color:#555; margin-bottom:16px; font-weight:700; }
  .m-btns { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }

  /* Effects */
  .star { position:fixed; pointer-events:none; font-size:clamp(22px,3.5vw,40px); animation:starPop .8s ease-out forwards; z-index:999; }
  @keyframes starPop { 0%{transform:scale(0) rotate(0);opacity:1} 100%{transform:scale(1.6) rotate(200deg);opacity:0} }

</style>
</head>
<body>

<div id="start">
  <div class="logo">FAMILY ADVENTURE!</div>
  <div class="st">家庭大冒险 — 掷骰子前进！</div>
  <div class="blocks">
    <div class="t-block red"></div>
    <div class="t-block yellow"></div>
    <div class="t-block blue"></div>
    <div class="t-block green"></div>
  </div>
  <div class="hint">点击任意处开始</div>
</div>

<div id="ui">
  <div class="top">
    <div class="chip"><span class="lab">得分</span><span class="val" id="score">0</span></div>
    <div class="chip"><span class="lab">步数</span><span class="val" id="pos">1/16</span></div>
    <div class="chip"><span class="lab">连击</span><span class="val" id="combo">🔥 0</span></div>
  </div>

  <div class="game">
    <div class="board">
      <div class="board-title">🗺️ 冒险路线</div>
      <div class="track" id="track"></div>
    </div>
    <div class="panel">
      <div class="panel-title">❓ 家庭问答</div>
      <div class="q" id="q"></div>
      <div class="opts" id="opts"></div>
      <div class="bottom">
        <button class="lego blue" id="rollBtn">
          <span class="studs"><span class="stud"></span><span class="stud"></span></span>
          <span class="dice" id="dice">🎲</span> 掷骰子
        </button>
        <button class="lego yellow" id="restartBtn">
          <span class="studs"><span class="stud"></span><span class="stud"></span></span>
          重新开始
        </button>
      </div>
    </div>
  </div>
</div>

<div class="modal" id="modal">
  <div class="m-card">
    <div class="m-emoji" id="mEmoji">🎊</div>
    <div class="m-title" id="mTitle">太棒了！</div>
    <div class="m-sub" id="mSub">你得到 0 分！</div>
    <div class="m-btns">
      <button class="lego green" id="againBtn">
        <span class="studs"><span class="stud"></span><span class="stud"></span></span>
        再玩一轮
      </button>
    </div>
  </div>
</div>

<script>
/* ===================== Sound ===================== */
class SoundEngine {
  constructor(){ this.ctx=null; this.ready=false; }
  init(){ if(this.ready) return; try{ this.ctx=new(window.AudioContext||window.webkitAudioContext)(); this.ready=true; }catch(e){} }
  play(type){
    if(!this.ctx) return; const now=this.ctx.currentTime;
    switch(type){
      case 'click': this.tone(700,0.06,'sine',0.08,now); break;
      case 'dice':
        this.tone(400,0.05,'sine',0.1,now);
        this.tone(500,0.05,'sine',0.1,now+0.06);
        this.tone(600,0.05,'sine',0.1,now+0.12); break;
      case 'correct':
        this.tone(523,.12,'sine',.18,now); this.tone(659,.12,'sine',.18,now+.08); this.tone(784,.18,'sine',.18,now+.16); break;
      case 'win': [523,659,784,1047,784,1047].forEach((f,i)=>this.tone(f,.3,'sine',.14,now+i*.14)); break;
      case 'wrong':
        const o=this.ctx.createOscillator(),g=this.ctx.createGain(); o.connect(g); g.connect(this.ctx.destination); o.type='sawtooth'; o.frequency.setValueAtTime(200,now); o.frequency.linearRampToValueAtTime(100,now+.25); g.gain.setValueAtTime(.12,now); g.gain.exponentialRampToValueAtTime(.001,now+.25); o.start(now); o.stop(now+.25); break;
    }
  }
  tone(freq,dur,type,vol,t){
    const o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.connect(g); g.connect(this.ctx.destination); o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.start(t); o.stop(t+dur);
  }
}
const sound=new SoundEngine();

/* ===================== Data ===================== */
const CELLS = [
  {emoji:"🚪", label:"Start"},
  {emoji:"👴", label:"grandpa"},
  {emoji:"👵", label:"grandma"},
  {emoji:"👨", label:"father"},
  {emoji:"👩", label:"mother"},
  {emoji:"👦", label:"brother"},
  {emoji:"👧", label:"sister"},
  {emoji:"🐕", label:"pet"},
  {emoji:"🏠", label:"home"},
  {emoji:"🎉", label:"party"},
  {emoji:"📸", label:"photo"},
  {emoji:"🎁", label:"gift"},
  {emoji:"🥘", label:"dinner"},
  {emoji:"📺", label:"TV"},
  {emoji:"🎮", label:"games"},
  {emoji:"🏆", label:"Finish"},
];

const QUESTIONS = [
  {q:"My father's father is my ____.", opts:["grandpa","grandma","uncle"], answer:"grandpa"},
  {q:"My mother's mother is my ____.", opts:["grandpa","grandma","aunt"], answer:"grandma"},
  {q:"My father's daughter is my ____.", opts:["brother","sister","cousin"], answer:"sister"},
  {q:"My mother's son is my ____.", opts:["brother","sister","cousin"], answer:"brother"},
  {q:"This is my ____. She is very kind.", opts:["mother","father","brother"], answer:"mother"},
  {q:"That is my ____. He is tall.", opts:["mother","father","sister"], answer:"father"},
  {q:"— Is he your brother? — Yes, ____.", opts:["he is","she is","it is"], answer:"he is"},
  {q:"— Is she your sister? — No, ____.", opts:["he isn't","she isn't","it isn't"], answer:"she isn't"},
  {q:"I love my ____. It is a dog.", opts:["pet","car","book"], answer:"pet"},
  {q:"We are a happy ____.", opts:["family","house","school"], answer:"family"},
  {q:"Come and meet my ____.", opts:["family","pen","desk"], answer:"family"},
  {q:"This is a photo of my ____.", opts:["family","book","pencil"], answer:"family"},
  {q:"My grandma's son is my ____.", opts:["father","brother","sister"], answer:"father"},
  {q:"My grandpa's daughter is my ____.", opts:["mother","brother","cousin"], answer:"mother"},
  {q:"I have a little ____. He is cute.", opts:["brother","mother","sister"], answer:"brother"},
];

/* ===================== State ===================== */
let state = { pos:0, score:0, combo:0, q:null, waiting:false, rolling:false };

/* ===================== DOM ===================== */
const startEl=document.getElementById('start');
const uiEl=document.getElementById('ui');
const trackEl=document.getElementById('track');
const qEl=document.getElementById('q');
const optsEl=document.getElementById('opts');
const scoreEl=document.getElementById('score');
const posEl=document.getElementById('pos');
const comboEl=document.getElementById('combo');
const rollBtn=document.getElementById('rollBtn');
const diceEl=document.getElementById('dice');
const restartBtn=document.getElementById('restartBtn');
const modal=document.getElementById('modal');
const mEmoji=document.getElementById('mEmoji');
const mTitle=document.getElementById('mTitle');
const mSub=document.getElementById('mSub');
const againBtn=document.getElementById('againBtn');

/* ===================== Init ===================== */
function init(){
  buildBoard(); pickQ(); updateUI();
}

function buildBoard(){
  trackEl.innerHTML='';
  CELLS.forEach((c,i)=>{
    const el=document.createElement('div'); el.className='cell'+(i===state.pos?' here':'');
    el.innerHTML='<div class="emoji">'+c.emoji+'</div><div>'+c.label+'</div>';
    el.dataset.id=i; trackEl.appendChild(el);
  });
}

function pickQ(){
  const pick=QUESTIONS[Math.floor(Math.random()*QUESTIONS.length)];
  state.q=pick;
  qEl.textContent=pick.q;
  optsEl.innerHTML='';
  const shuffled=pick.opts.slice().sort(()=>Math.random()-.5);
  const colors=['red','blue','yellow','green','orange','purple'];
  shuffled.forEach((o,i)=>{
    const el=document.createElement('div'); el.className='opt'; el.textContent=o; el.dataset.ans=o;
    el.addEventListener('click',()=>onOpt(o,el));
    optsEl.appendChild(el);
  });
}

function onOpt(o,el){
  if(state.waiting) return;
  state.waiting=true;
  sound.init();
  const correct=o===state.q.answer;
  if(correct){
    el.classList.add('correct');
    state.combo++;
    let pts=10; if(state.combo>=3) pts=15; if(state.combo>=5) pts=20;
    state.score+=pts;
    sound.play('correct'); spawnStars(); updateUI();
  }else{
    el.classList.add('wrong');
    state.combo=0;
    sound.play('wrong');
    setTimeout(()=>{
      const all=optsEl.querySelectorAll('.opt');
      all.forEach(x=>{ if(x.dataset.ans===state.q.answer) x.classList.add('correct'); });
    },250);
  }
  setTimeout(()=>{
    rollBtn.disabled=false; state.waiting=false;
  },800);
}

/* ===================== Dice ===================== */
rollBtn.addEventListener('click',()=>{
  if(state.rolling) return;
  state.rolling=true; rollBtn.disabled=true;
  sound.init(); sound.play('dice');
  diceEl.classList.add('roll');

  let count=0; let finalRoll=0;
  const interval=setInterval(()=>{
    const n=Math.floor(Math.random()*6)+1;
    diceEl.textContent=['🎲','⚀','⚁','⚂','⚃','⚄','⚅'][n];
    count++;
    if(count>=12){
      clearInterval(interval);
      finalRoll=n;
      diceEl.classList.remove('roll');
      move(finalRoll);
    }
  },60);
});

function move(roll){
  let cur=state.pos;
  const target=Math.min(cur+roll, CELLS.length-1);

  let step=0;
  const walk=setInterval(()=>{
    cur++;
    if(cur>target){ clearInterval(walk); finishMove(); return; }
    state.pos=cur; updateBoard(); updateUI();
    sound.play('click');
    step++;
  },180);
}

function finishMove(){
  state.rolling=false;
  if(state.pos>=CELLS.length-1){
    setTimeout(()=>{ sound.play('win'); showModal(); },500);
    return;
  }
  pickQ();
}

function updateBoard(){
  const cells=trackEl.querySelectorAll('.cell');
  cells.forEach((c,i)=>{
    c.classList.remove('here');
    if(i<state.pos) c.classList.add('done');
  });
  cells[state.pos].classList.add('here');
}

function updateUI(){
  scoreEl.textContent=state.score;
  posEl.textContent=(state.pos+1)+'/'+CELLS.length;
  comboEl.textContent='🔥 '+state.combo;
}

function spawnStars(){
  const rect=trackEl.getBoundingClientRect();
  for(let i=0;i<12;i++){
    const s=document.createElement('div'); s.className='star';
    s.textContent=['⭐','✨','🌟','💫'][Math.floor(Math.random()*4)];
    s.style.left=(rect.left+Math.random()*rect.width)+'px';
    s.style.top=(rect.top+Math.random()*rect.height)+'px';
    document.body.appendChild(s); setTimeout(()=>s.remove(),800);
  }
}

function showModal(){
  mEmoji.textContent='🎊'; mTitle.textContent='太棒了！'; mSub.textContent='你得到 '+state.score+' 分！';
  modal.classList.add('show');
}

/* ===================== Events ===================== */
startEl.addEventListener('click',()=>{
  sound.init(); sound.play('click');
  startEl.classList.add('hidden');
  uiEl.style.display='flex';
  init();
});

restartBtn.addEventListener('click',()=>{
  sound.init(); sound.play('click');
  state={ pos:0, score:0, combo:0, q:null, waiting:false, rolling:false };
  diceEl.textContent='🎲';
  buildBoard(); pickQ(); updateUI();
  rollBtn.disabled=false;
});

againBtn.addEventListener('click',()=>{
  sound.init(); sound.play('click');
  modal.classList.remove('show');
  state={ pos:0, score:0, combo:0, q:null, waiting:false, rolling:false };
  diceEl.textContent='🎲';
  buildBoard(); pickQ(); updateUI();
  rollBtn.disabled=false;
});

/* Shake keyframe */
const style=document.createElement('style');
style.textContent='@keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-10px)} 40%{transform:translateX(10px)} 60%{transform:translateX(-6px)} 80%{transform:translateX(6px)} }';
document.head.appendChild(style);

</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>八上 Unit 7 - When Tomorrow Comes</title>
<style>
*{box-sizing:border-box}
body{
    margin:0;
    font-family:'Segoe UI',system-ui,sans-serif;
    background:linear-gradient(135deg,#e0f2fe,#dbeafe,#e0e7ff);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    color:#1e293b
}
.container{
    width:100%;
    max-width:900px;
    background:#fff;
    border-radius:24px;
    box-shadow:0 20px 60px rgba(0,0,0,.15);
    overflow:hidden;
    position:relative
}
.header{
    background:linear-gradient(135deg,#0ea5e9,#6366f1);
    color:#fff;
    padding:24px;
    text-align:center;
    position:relative
}
.header h1{
    margin:0;
    font-size:28px;
    letter-spacing:1px
}
.header p{
    margin:8px 0 0;
    opacity:.9
}
.stars{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    pointer-events:none;
    overflow:hidden
}
.star{
    position:absolute;
    width:8px;
    height:8px;
    background:#fff;
    border-radius:50%;
    opacity:.5;
    animation:twinkle 2s infinite
}
@keyframes twinkle{
    0%,100%{opacity:.2;transform:scale(1)}
    50%{opacity:.8;transform:scale(1.3)}
}
.game-wrapper{
    padding:28px
}
.progress{
    display:flex;
    gap:8px;
    justify-content:center;
    margin-bottom:20px
}
.dot{
    width:12px;
    height:12px;
    border-radius:50%;
    background:#e2e8f0;
    transition:.3s
}
.dot.active{
    background:#0ea5e9;
    box-shadow:0 0 10px rgba(14,165,233,.4)
}
.dot.done{
    background:#22c55e
}
.scoreboard{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 18px;
    background:#f1f5f9;
    border-radius:14px;
    margin-bottom:20px
}
.score{
    font-weight:700;
    font-size:30px;
    color:#0f172a
}
.combo{
    font-size:26px;
    color:#64748b
}
.panel{
    background:linear-gradient(180deg,#f8fafc,#e0f2fe);
    border:2px dashed #94a3b8;
    border-radius:18px;
    padding:24px;
    text-align:center;
    min-height:220px;
    display:flex;
    flex-direction:column;
    justify-content:center
}
.question{
    font-size:36px;
    margin-bottom:20px;
    line-height:1.5
}
.options{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px
}
.btn{
    padding:14px 16px;
    font-size:30px;
    border:2px solid #cbd5e1;
    border-radius:12px;
    background:#fff;
    cursor:pointer;
    transition:.2s;
    font-weight:600
}
.btn:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 20px rgba(0,0,0,.08);
    border-color:#0ea5e9
}
.btn.correct{
    background:#dcfce7;
    border-color:#22c55e;
    color:#166534
}
.btn.wrong{
    background:#fee2e2;
    border-color:#ef4444;
    color:#991b1b;
    animation:shake .4s
}
@keyframes shake{
    0%,100%{transform:translateX(0)}
    25%{transform:translateX(-6px)}
    75%{transform:translateX(6px)}
}
.start-screen, .end-screen{
    text-align:center;
    padding:30px
}
.big-btn{
    margin-top:18px;
    padding:16px 32px;
    font-size:32px;
    border:none;
    border-radius:14px;
    background:linear-gradient(135deg,#0ea5e9,#6366f1);
    color:#fff;
    cursor:pointer;
    font-weight:700;
    transition:.25s;
    box-shadow:0 10px 25px rgba(99,102,241,.3)
}
.big-btn:hover{transform:translateY(-3px) scale(1.02)}
.hidden{display:none}
.capsule{
    display:flex;
    justify-content:center;
    gap:16px;
    margin:18px 0;
    flex-wrap:wrap
}
.item{
    width:70px;
    height:70px;
    border-radius:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:34px;
    background:#fff;
    box-shadow:0 6px 16px rgba(0,0,0,.08);
    animation:float 3s ease-in-out infinite
}
.item:nth-child(2){animation-delay:.5s}
.item:nth-child(3){animation-delay:1s}
.item:nth-child(4){animation-delay:1.5s}
@keyframes float{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-8px)}
}

/* === classroom projection font boost (added) === */
.container{max-width:1200px}
.header h1{font-size:52px}
.header p{font-size:28px}
.start-screen h2{font-size:44px}
.start-screen p{font-size:24px}
.start-screen .big-btn{font-size:36px}
.end-screen h2{font-size:40px}
.end-screen p{font-size:26px}
.end-screen .big-btn{font-size:36px}
.question{font-size:44px}
.btn{font-size:34px}
.options{display:flex;flex-direction:column;gap:14px}
.score{font-size:36px}
.combo{font-size:30px}
.story-so-far{font-size:32px}
.page{font-size:44px}
.big-btn{font-size:34px}

</style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="stars" id="stars"></div>
        <h1>Unit 7 ✨ When Tomorrow Comes</h1>
        <p>Grammar: will / won't — 谈论将来</p>
    </div>
    <div class="game-wrapper">
        <div id="start" class="start-screen">
            <div class="capsule">
                <div class="item">🚀</div><div class="item">🔮</div><div class="item">📦</div><div class="item">🌠</div>
            </div>
            <h2>Time Capsule Adventure</h2>
            <p>Answer questions about the future and lock your predictions!</p>
            <button class="big-btn" id="startBtn">Start Game</button>
        </div>
        <div id="game" class="hidden">
            <div class="progress" id="progress"></div>
            <div class="scoreboard">
                <div class="score">Score: <span id="score">0</span></div>
                <div class="combo">Combo: <span id="combo">0</span></div>
            </div>
            <div class="panel">
                <div class="question" id="qText"></div>
                <div class="options" id="options"></div>
            </div>
        </div>
        <div id="end" class="end-screen hidden">
            <h2>🎉 Time Capsule Sealed!</h2>
            <p>Your final score: <strong id="final"></strong></p>
            <p>You're ready for the future!</p>
            <button class="big-btn" id="again">Play Again</button>
        </div>
    </div>
</div>
<script>
class SoundEngine{
    constructor(){
        this.ctx=null
    }
    init(){
        if(!this.ctx) this.ctx=new (window.AudioContext||window.webkitAudioContext)()
    }
    play(type){
        this.init();
        const o=this.ctx.createOscillator(),g=this.ctx.createGain();
        o.connect(g);g.connect(this.ctx.destination);
        const now=this.ctx.currentTime;
        switch(type){
            case 'click':
                o.frequency.value=600;g.gain.setValueAtTime(.2,now);g.gain.exponentialRampToValueAtTime(.01,now+.1);o.start(now);o.stop(now+.1);break;
            case 'correct':
                o.frequency.value=523;g.gain.setValueAtTime(.25,now);o.start(now);
                setTimeout(()=>{o.frequency.value=659},100);
                setTimeout(()=>{o.frequency.value=784},200);
                g.gain.exponentialRampToValueAtTime(.01,now+.4);o.stop(now+.4);break;
            case 'wrong':
                o.type='sawtooth';o.frequency.value=200;g.gain.setValueAtTime(.18,now);g.gain.exponentialRampToValueAtTime(.01,now+.3);o.start(now);o.stop(now+.3);break;
            case 'win':
                [523,587,659,784,880].forEach((f,i)=>{
                    const o2=this.ctx.createOscillator(),g2=this.ctx.createGain();
                    o2.connect(g2);g2.connect(this.ctx.destination);
                    o2.frequency.value=f;g2.gain.setValueAtTime(.2,now+i*.12);g2.gain.exponentialRampToValueAtTime(.01,now+i*.12+.2);
                    o2.start(now+i*.12);o2.stop(now+i*.12+.2)
                })
        }
    }
}
const sound=new SoundEngine();
const questions=[
    {q:"I ____ (visit) the moon one day.",opts:["am visit","will visit","visits","visit"],a:1},
    {q:"People ____ (live) on Mars in 2100.",opts:["will live","lives","live","living"],a:0},
    {q:"We ____ (not / have) classes tomorrow.",opts:["don't have","won't have","not have","willn't have"],a:1},
    {q:"____ you ____ (come) to my party?",opts:["Do / come","Are / come","Will / come","Will / coming"],a:2},
    {q:"I think robots ____ (do) everything soon.",opts:["do","does","will do","doing"],a:2},
    {q:"She ____ (be) a doctor when she grows up.",opts:["is","will be","be","will is"],a:1},
    {q:"____ it rain tomorrow?",opts:["Is","Do","Will","Does"],a:2},
    {q:"They ____ (not / travel) next week.",opts:["won't travel","don't travel","not travel","won't travels"],a:0},
    {q:"I ____ (buy) a new phone next year.",opts:["buy","will buy","buys","am buy"],a:1},
    {q:"____ we meet at 3pm?",opts:["Do","Are","Will","Does"],a:2}
];
let idx=0,score=0,combo=0;
const progress=document.getElementById('progress');
const qText=document.getElementById('qText');
const options=document.getElementById('options');
const scoreEl=document.getElementById('score');
const comboEl=document.getElementById('combo');
const start=document.getElementById('start');
const game=document.getElementById('game');
const end=document.getElementById('end');
const final=document.getElementById('final');
function createStars(){
    const stars=document.getElementById('stars');
    for(let i=0;i<18;i++){
        const s=document.createElement('div');
        s.className='star';
        s.style.left=Math.random()*100+'%';
        s.style.top=Math.random()*100+'%';
        s.style.animationDelay=Math.random()*2+'s';
        stars.appendChild(s)
    }
}
function renderProgress(){
    progress.innerHTML='';
    for(let i=0;i<questions.length;i++){
        const d=document.createElement('div');
        d.className='dot';
        if(i<idx) d.classList.add('done');
        if(i===idx) d.classList.add('active');
        progress.appendChild(d)
    }
}
function renderQ(){
    renderProgress();
    const q=questions[idx];
    qText.textContent=q.q;
    options.innerHTML='';
    q.opts.forEach((opt,i)=>{
        const b=document.createElement('button');
        b.className='btn';
        b.textContent=opt;
        b.onclick=()=>choose(i);
        options.appendChild(b)
    })
}
function choose(i){
    sound.play('click');
    const q=questions[idx];
    const btns=options.querySelectorAll('.btn');
    btns.forEach(b=>b.disabled=true);
    if(i===q.a){
        btns[i].classList.add('correct');
        sound.play('correct');
        combo++;
        score+=10+(combo>1?combo*2:0)
    }else{
        btns[i].classList.add('wrong');
        btns[q.a].classList.add('correct');
        sound.play('wrong');
        combo=0
    }
    scoreEl.textContent=score;
    comboEl.textContent=combo;
    setTimeout(()=>{
        idx++;
        if(idx<questions.length) renderQ();
        else showEnd()
    },900)
}
function showEnd(){
    game.classList.add('hidden');
    end.classList.remove('hidden');
    final.textContent=score;
    sound.play('win')
}
document.getElementById('startBtn').onclick=()=>{
    sound.play('click');
    start.classList.add('hidden');
    game.classList.remove('hidden');
    renderQ()
};
document.getElementById('again').onclick=()=>{
    sound.play('click');
    idx=0;score=0;combo=0;
    scoreEl.textContent=0;comboEl.textContent=0;
    end.classList.add('hidden');
    start.classList.remove('hidden')
};
createStars()
</script>
</body>
</html>

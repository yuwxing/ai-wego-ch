<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit 1 Happy Holiday — Travel Diary!</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --bg:#f0fff5; --paper:#fafff4; --border:#234e34; --accent:#22c55e;
    --accent2:#86efac; --green:#16a34a; --muted:#577863;
  }
  html,body { width:100%; height:100%; font-family:"Comic Sans MS","Comic Neue","PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); overflow:hidden; }

  /* Start */
  #start { position:fixed; inset:0; background:linear-gradient(135deg,#dcfce7,#f0fff5); z-index:1000; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; transition:opacity .6s; }
  #start.hidden { opacity:0; pointer-events:none; }
  .cover { background:var(--paper); border:5px solid var(--border); border-radius:24px; padding:40px 60px; box-shadow:0 14px 0 var(--border); text-align:center; transform:rotate(0.9deg); }
  .title { font-size:clamp(34px,6vw,60px); font-weight:900; color:var(--accent); margin-bottom:8px; }
  .subtitle { font-size:clamp(16px,4.00vw,50px); color:var(--border); font-weight:800; }
  .stickers { display:flex; gap:14px; justify-content:center; margin-top:18px; }
  .sticker { font-size:clamp(26px,4vw,44px); filter:drop-shadow(0 4px 0 rgba(0,0,0,.15)); animation:float 2.2s ease-in-out infinite; }
  .sticker:nth-child(2){ animation-delay:.25s }
  .sticker:nth-child(3){ animation-delay:.5s }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
  .hint { font-size:clamp(14px,3.20vw,40px); color:var(--muted); margin-top:28px; animation:pulse 1.6s infinite; }
  @keyframes pulse { 0%,100%{opacity:.6} 50%{opacity:1} }

  /* UI */
  #ui { width:100%; height:100%; display:none; flex-direction:column; padding:clamp(8px,1.2vh,16px) clamp(10px,1.8vw,28px); }
  .top { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:10px; }
  .tag { background:#fff; border:3px solid var(--border); border-radius:18px; padding:8px 16px; font-size:clamp(13px,2.88vw,36px); font-weight:800; box-shadow:0 6px 0 var(--border); display:flex; align-items:center; gap:8px; }
  .tag .lab { color:var(--muted); font-weight:700; }
  .tag .val { color:var(--accent); font-size:clamp(15px,3.20vw,43px); }

  /* Content */
  .board { flex:1; display:grid; grid-template-columns:1fr; gap:14px; min-height:0; }
  @media (min-width:1000px){ .board{grid-template-columns:1.15fr .85fr;} }

  .diary { background:var(--paper); border:5px solid var(--border); border-radius:24px; padding:clamp(16px,2.2vw,34px); box-shadow:0 14px 0 var(--border); display:flex; flex-direction:column; min-height:0; overflow:auto; }
  .diary-title { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .emoji-big { font-size:clamp(34px,5vw,54px); }
  .title-text { font-size:clamp(18px,4.16vw,54px); font-weight:900; color:var(--border); }
  .content { flex:1; display:flex; flex-direction:column; justify-content:center; gap:10px; }
  .entry { background:#fff; border:4px solid var(--border); border-radius:16px; padding:14px 16px; font-size:clamp(14px,3.04vw,38px); font-weight:800; color:var(--border); box-shadow:0 8px 0 var(--border); line-height:1.55; }
  .context { font-size:clamp(12px,2.56vw,31px); color:var(--muted); margin-bottom:8px; font-weight:700; }
  .entry .gap { display:inline-flex; align-items:center; justify-content:center; min-width:160px; border-bottom:4px solid var(--border); padding:0 8px; color:var(--accent); }

  .panel { background:var(--paper); border:5px solid var(--border); border-radius:24px; padding:clamp(16px,2.2vw,34px); box-shadow:0 14px 0 var(--border); display:flex; flex-direction:column; gap:10px; min-height:0; }
  .panel-title { font-size:clamp(16px,3.52vw,47px); font-weight:900; color:var(--border); text-align:center; margin-bottom:6px; }
  .btn { background:#fff; border:4px solid var(--border); border-radius:16px; padding:14px 16px; font-size:clamp(14px,2.88vw,36px); font-weight:900; color:var(--border); box-shadow:0 8px 0 var(--border); cursor:pointer; transition:transform .08s, box-shadow .08s; text-align:left; }
  .btn:hover { transform:translateY(-3px); box-shadow:0 11px 0 var(--border); }
  .btn:active { transform:translateY(6px); box-shadow:0 4px 0 var(--border); }
  .btn.correct { background:var(--green); color:#fff; pointer-events:none; }
  .btn.wrong { background:#ff9e9e; color:#5c1a1a; animation:shake .35s ease; pointer-events:none; }

  .controls { display:flex; gap:10px; justify-content:center; margin-top:8px; flex-wrap:wrap; }
  .next { background:var(--accent2); color:#fff; }
  .restart { background:var(--accent); color:#fff; }

  /* Progress */
  .progress { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-top:6px; }
  .dot { width:22px; height:22px; border-radius:50%; border:3px solid var(--border); background:#fff; box-shadow:0 4px 0 var(--border); }
  .dot.done { background:var(--green); }
  .dot.now { background:var(--accent); transform:scale(1.1); }

  /* Modal */
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; align-items:center; justify-content:center; z-index:500; }
  .modal.show { display:flex; }
  .m-card { background:var(--paper); border:5px solid var(--border); border-radius:24px; padding:36px 50px; box-shadow:0 16px 0 var(--border); text-align:center; max-width:90vw; animation:pop .35s ease; }
  @keyframes pop { from{transform:scale(.8);opacity:0} to{transform:scale(1);opacity:1} }
  .m-emoji { font-size:clamp(48px,8vw,80px); margin-bottom:8px; }
  .m-title { font-size:clamp(22px,3.2vw,36px); font-weight:900; color:var(--border); margin-bottom:6px; }
  .m-sub { font-size:clamp(15px,3.20vw,40px); color:var(--muted); font-weight:800; margin-bottom:16px; }
  .m-btns { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }

  /* Effects */
  .star { position:fixed; pointer-events:none; font-size:clamp(20px,3.5vw,40px); animation:starPop .8s ease-out forwards; z-index:999; }
  @keyframes starPop { 0%{transform:scale(0) rotate(0);opacity:1} 100%{transform:scale(1.6) rotate(200deg);opacity:0} }

</style>
</head>
<body>

<div id="start">
  <div class="cover">
    <div class="title">✈️ Happy Holiday!</div>
    <div class="subtitle">过去时 — 高级挑战版</div>
    <div class="stickers">
      <div class="sticker">🗺️</div>
      <div class="sticker">🏖️</div>
      <div class="sticker">📸</div>
    </div>
  </div>
  <div class="hint">点击翻开旅行日记！</div>
</div>

<div id="ui">
  <div class="top">
    <div class="tag"><span class="lab">得分</span><span class="val" id="score">0</span></div>
    <div class="tag"><span class="lab">日记</span><span class="val" id="entry">1/10</span></div>
    <div class="tag"><span class="lab">连击</span><span class="val" id="combo">🔥 0</span></div>
  </div>

  <div class="board">
    <div class="diary">
      <div class="diary-title">
        <div class="emoji-big" id="entryEmoji">📝</div>
        <div class="title-text" id="entryTitle">My Trip</div>
      </div>
      <div class="content" id="content"></div>
      <div class="progress" id="progress"></div>
    </div>

    <div class="panel">
      <div class="panel-title">选择正确的表达</div>
      <div id="btns"></div>
      <div class="controls">
        <button class="btn next" id="nextBtn" style="display:none">下一个 →</button>
        <button class="btn restart" id="restartBtn">重新开始</button>
      </div>
    </div>
  </div>
</div>

<div class="modal" id="modal">
  <div class="m-card">
    <div class="m-emoji" id="mEmoji">🎊</div>
    <div class="m-title" id="mTitle">旅行日记写完了！</div>
    <div class="m-sub" id="mSub">你得到 0 分！</div>
    <div class="m-btns">
      <button class="btn next" id="againBtn">再玩一次</button>
    </div>
  </div>
</div>

<script>
/* ===================== Sound ===================== */
class SoundEngine {
  constructor(){ this.ctx=null; this.ready=false; }
  init(){ if(this.ready) return; try{ this.ctx=new(window.AudioContext||window.webkitAudioContext)(); this.ready=true; }catch(e){} }
  play(type){
    if(!this.ctx) return; const now=this.ctx.currentTime;
    switch(type){
      case 'click': this.tone(700,0.06,'sine',0.08,now); break;
      case 'correct':
        this.tone(523,.12,'sine',.18,now); this.tone(659,.12,'sine',.18,now+.08); this.tone(784,.18,'sine',.18,now+.16); break;
      case 'win': [523,659,784,1047,784,1047].forEach((f,i)=>this.tone(f,.3,'sine',.14,now+i*.14)); break;
      case 'wrong':
        const o=this.ctx.createOscillator(),g=this.ctx.createGain(); o.connect(g); g.connect(this.ctx.destination); o.type='sawtooth'; o.frequency.setValueAtTime(200,now); o.frequency.linearRampToValueAtTime(100,now+.25); g.gain.setValueAtTime(.12,now); g.gain.exponentialRampToValueAtTime(.001,now+.25); o.start(now); o.stop(now+.25); break;
    }
  }
  tone(freq,dur,type,vol,t){
    const o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.connect(g); g.connect(this.ctx.destination); o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.start(t); o.stop(t+dur);
  }
}
const sound=new SoundEngine();

/* ===================== Data (High Difficulty) */
const ENTRIES = [
  {
    emoji:"🚂", title:"Arrival",
    context:"你去西安旅行，坐了12小时火车才到，写日记记录。",
    text:"We <span class='gap' id='gap'></span> the train at 7am and <span class='gap' id='gap2'></span> in Xi'an at 7pm after 12 hours on the road.",
    answer:"took, arrived",
    opts:["took, arrived","taked, arrived","take, arrive","took, arrive"]
  },
  {
    emoji:"🏛️", title:"Terracotta Army",
    context:"你第一天去看兵马俑，非常震撼，问了导游很多问题。",
    text:"The tour guide <span class='gap' id='gap'></span> us about the history, and we <span class='gap' id='gap2'></span> hundreds of amazing photos.",
    answer:"told, took",
    opts:["told, took","telled, taked","said, took","told, take"]
  },
  {
    emoji:"🍜", title:"Local Food",
    context:"你们在小吃街吃了很多好吃的，但你妹妹不太喜欢羊肉泡馍。",
    text:"We <span class='gap' id='gap'></span> a lot of delicious snacks, but my sister <span class='gap' id='gap2'></span> the mutton soup very much.",
    answer:"ate, didn't like",
    opts:["ate, didn't like","eated, don't like","eat, doesn't like","ate, not liked"]
  },
  {
    emoji:"🌧️", title:"Unexpected Rain",
    context:"第二天计划去华山，但早上下大雨，你们只好留在宾馆。",
    text:"It <span class='gap' id='gap'></span> heavily in the morning, so we <span class='gap' id='gap2'></span> go to Huashan and stayed in the hotel instead.",
    answer:"rained, couldn't",
    opts:["rained, couldn't","rain, can't","rained, can't","rains, couldn't"]
  },
  {
    emoji:"🛍️", title:"Shopping",
    context:"你给朋友买了明信片，你爸妈买了一些当地特产。",
    text:"I <span class='gap' id='gap'></span> postcards for my friends, and my parents <span class='gap' id='gap2'></span> some local specialties.",
    answer:"bought, got",
    opts:["bought, got","buyed, get","bought, get","buy, got"]
  },
  {
    emoji:"😰", title:"Lost Wallet",
    context:"你钱包差点丢了，幸好被一位老奶奶捡到还给你。",
    text:"I <span class='gap' id='gap'></span> my wallet, but luckily a grandma <span class='gap' id='gap2'></span> it and gave it back.",
    answer:"lost, found",
    opts:["lost, found","losed, finded","lose, find","lost, find"]
  },
  {
    emoji:"🎭", title:"Tang Dynasty Show",
    context:"最后一晚你们看了唐朝歌舞表演，你觉得是这次旅行最棒的部分。",
    text:"We <span class='gap' id='gap'></span> the Tang Dynasty show on our last night, and I <span class='gap' id='gap2'></span> it was the best part of the trip.",
    answer:"watched, thought",
    opts:["watched, thought","watch, think","watched, think","watching, thought"]
  },
  {
    emoji:"📱", title:"Too Many Pictures",
    context:"你拍了太多照片，导致手机空间不够用了。",
    text:"I <span class='gap' id='gap'></span> so many photos that I <span class='gap' id='gap2'></span> out of storage space on my phone.",
    answer:"took, ran",
    opts:["took, ran","taked, run","take, ran","took, run"]
  },
  {
    emoji:"😴", title:"Tired but Happy",
    context:"旅行结束，你累坏了，但非常开心。你朋友问你玩得好不好。",
    text:"A: <span class='gap' id='gap'></span> you have a good time?  B: Yes! I was tired but very happy.",
    answer:"Did",
    opts:["Did","Do","Were","Are"]
  },
  {
    emoji:"✍️", title:"Writing the Diary",
    context:"回到家你在写日记，回忆起那些难忘的瞬间。",
    text:"Now I'm writing this diary and <span class='gap' id='gap'></span> all the unforgettable moments we <span class='gap' id='gap2'></span>.",
    answer:"remembering, had",
    opts:["remembering, had","remember, have","remembering, have","remembered, had"]
  }
];

/* ===================== State */
let state = { entry:0, score:0, combo:0, waiting:false };

/* ===================== DOM */
const startEl=document.getElementById('start');
const uiEl=document.getElementById('ui');
const scoreEl=document.getElementById('score');
const entryEl=document.getElementById('entry');
const comboEl=document.getElementById('combo');
const entryEmojiEl=document.getElementById('entryEmoji');
const entryTitleEl=document.getElementById('entryTitle');
const contentEl=document.getElementById('content');
const btnsEl=document.getElementById('btns');
const nextBtn=document.getElementById('nextBtn');
const restartBtn=document.getElementById('restartBtn');
const progressEl=document.getElementById('progress');
const modal=document.getElementById('modal');
const mEmoji=document.getElementById('mEmoji');
const mTitle=document.getElementById('mTitle');
const mSub=document.getElementById('mSub');
const againBtn=document.getElementById('againBtn');

/* ===================== Init */
function init(){
  state={ entry:0, score:0, combo:0, waiting:false };
  loadEntry(0);
  updateUI();
}

function loadEntry(entryIdx){
  const e=ENTRIES[entryIdx];
  entryEmojiEl.textContent=e.emoji;
  entryTitleEl.textContent=e.title;
  contentEl.innerHTML=`
    <div class="context">${e.context}</div>
    <div class="entry">${e.text}</div>
  `;

  const shuffled=e.opts.slice().sort(()=>Math.random()-.5);
  btnsEl.innerHTML='';
  shuffled.forEach(o=>{
    const b=document.createElement('div'); b.className='btn'; b.textContent=o;
    b.addEventListener('click',()=>onChoice(o,b,e.answer));
    btnsEl.appendChild(b);
  });

  nextBtn.style.display='none';
  updateProgress();
  updateUI();
}

function onChoice(o,el,ans){
  if(state.waiting) return;
  state.waiting=true; sound.init();
  if(o===ans){
    el.classList.add('correct');
    state.combo++;
    let pts=10; if(state.combo>=3) pts=15; if(state.combo>=5) pts=20; state.score+=pts;
    sound.play('correct'); spawnStars(); updateUI();
    const gaps=contentEl.querySelectorAll('.gap');
    const parts=ans.split(', ');
    gaps.forEach((gap,i)=>{ if(parts[i]){ gap.textContent=parts[i]; gap.style.borderBottomColor='var(--green)'; gap.style.color='var(--green)'; } });
    setTimeout(()=>{ nextBtn.style.display='inline-flex'; state.waiting=false; },450);
  }else{
    el.classList.add('wrong'); state.combo=0; sound.play('wrong');
    setTimeout(()=>{
      const all=btnsEl.querySelectorAll('.btn');
      all.forEach(x=>{ if(x.textContent===ans) x.classList.add('correct'); });
      setTimeout(()=>{ nextBtn.style.display='inline-flex'; state.waiting=false; updateUI(); },500);
    },300);
  }
}

/* ===================== UI */
function updateUI(){
  scoreEl.textContent=state.score;
  entryEl.textContent=(state.entry+1)+'/'+ENTRIES.length;
  comboEl.textContent='🔥 '+state.combo;
}

function updateProgress(){
  progressEl.innerHTML='';
  ENTRIES.forEach((d,i)=>{
    const el=document.createElement('div'); el.className='dot'+(i<state.entry?' done':'')+(i===state.entry?' now':'');
    progressEl.appendChild(el);
  });
}

function spawnStars(){
  const rect=contentEl.getBoundingClientRect();
  for(let i=0;i<12;i++){
    const s=document.createElement('div'); s.className='star';
    s.textContent=['⭐','✨','🌟','💫'][Math.floor(Math.random()*4)];
    s.style.left=(rect.left+Math.random()*rect.width)+'px';
    s.style.top=(rect.top+Math.random()*rect.height)+'px';
    document.body.appendChild(s); setTimeout(()=>s.remove(),800);
  }
}

function showModal(){
  mEmoji.textContent='🎊'; mTitle.textContent='旅行日记写完了！'; mSub.textContent='你得到 '+state.score+' 分！';
  modal.classList.add('show');
}

/* ===================== Events */
startEl.addEventListener('click',()=>{
  sound.init(); sound.play('click');
  startEl.classList.add('hidden'); uiEl.style.display='flex'; init();
});

nextBtn.addEventListener('click',()=>{
  sound.init(); sound.play('click');
  state.entry++;
  if(state.entry>=ENTRIES.length){ setTimeout(()=>{ sound.play('win'); showModal(); },400); return; }
  loadEntry(state.entry);
});

restartBtn.addEventListener('click',()=>{
  sound.init(); sound.play('click'); init();
});

againBtn.addEventListener('click',()=>{
  sound.init(); sound.play('click'); modal.classList.remove('show'); init();
});

/* Shake keyframe */
const style=document.createElement('style');
style.textContent='@keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-10px)} 40%{transform:translateX(10px)} 60%{transform:translateX(-6px)} 80%{transform:translateX(6px)} }';
document.head.appendChild(style);

</script>
</body>
</html>

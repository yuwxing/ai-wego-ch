<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit 5 - LEGO Block Builder!</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --bg:#f8f9fa; --grid:#e9ecef;
    --lego-red:#e32121; --lego-blue:#006cb7; --lego-yellow:#ffd400; --lego-green:#009640;
    --lego-orange:#ff7d00; --lego-purple:#97007d; --lego-black:#1a1a1a;
    --text:#1c1c1e; --muted:#8e8e93;
  }
  html,body { width:100%; height:100%; font-family:"Comic Sans MS","Comic Neue","PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); overflow:hidden; }

  /* ===== Start screen ===== */
  #start { position:fixed; inset:0; background:linear-gradient(135deg,#ffd400,#ff9f1c); z-index:1000; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; transition:opacity .6s; }
  #start.hidden { opacity:0; pointer-events:none; }
  .lego-logo { font-size:clamp(60px,10vw,120px); font-weight:900; letter-spacing:4px; color:#000; margin-bottom:10px; text-shadow:6px 6px 0 #e32121,12px 12px 0 #006cb7; transform:skewX(-6deg); }
  .sub-title { font-size:clamp(20px,3vw,40px); font-weight:800; color:#000; margin-bottom:24px; }
  .block-row { display:flex; gap:10px; margin-bottom:20px; }
  .t-block { width:clamp(40px,7vw,80px); height:clamp(40px,7vw,80px); background:var(--lego-red); border-radius:10px; position:relative; display:flex; align-items:center; justify-content:center; box-shadow:inset 0 -8px 0 rgba(0,0,0,.18), inset 0 8px 0 rgba(255,255,255,.2), 0 12px 0 #b51a1a,0 18px 20px rgba(0,0,0,.25); animation:bounce 1.2s infinite; }
  .t-block.blue { background:var(--lego-blue); animation-delay:.15s; box-shadow:inset 0 -8px 0 rgba(0,0,0,.18), inset 0 8px 0 rgba(255,255,255,.2), 0 12px 0 #004f83,0 18px 20px rgba(0,0,0,.25); }
  .t-block.yellow { background:var(--lego-yellow); animation-delay:.3s; box-shadow:inset 0 -8px 0 rgba(0,0,0,.18), inset 0 8px 0 rgba(255,255,255,.2), 0 12px 0 #c7a100,0 18px 20px rgba(0,0,0,.25); }
  .t-block.green { background:var(--lego-green); animation-delay:.45s; box-shadow:inset 0 -8px 0 rgba(0,0,0,.18), inset 0 8px 0 rgba(255,255,255,.2), 0 12px 0 #006b2e,0 18px 20px rgba(0,0,0,.25); }
  .t-block::after { content:''; width:50%; height:50%; border:3px solid rgba(0,0,0,.15); border-radius:50%; box-shadow:inset 0 2px 0 rgba(255,255,255,.3); }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-14px)} }
  .hint { font-size:clamp(16px,3.20vw,43px); color:rgba(0,0,0,.6); margin-top:20px; animation:pulse 1.6s infinite; }
  @keyframes pulse { 0%,100%{opacity:.6} 50%{opacity:1} }

  /* ===== Main UI ===== */
  #ui { width:100%; height:100%; display:none; flex-direction:column; padding:clamp(10px,1.5vh,20px) clamp(10px,2vw,30px); }
  .top { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:10px; }
  .chip { background:#fff; border:3px solid #000; border-radius:14px; padding:clamp(6px,1vh,12px) clamp(14px,2vw,24px); font-size:clamp(14px,2.88vw,40px); font-weight:800; box-shadow:0 6px 0 #000; display:flex; align-items:center; gap:8px; }
  .chip .lab { color:#8e8e93; font-weight:600; }
  .chip .val { color:var(--lego-red); font-size:clamp(18px,4.00vw,54px); }

  /* Level selector */
  .levels { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-bottom:10px; }
  .lvl { background:#fff; border:3px solid #000; border-radius:14px; padding:8px 16px; font-size:clamp(13px,2.56vw,36px); font-weight:800; cursor:pointer; box-shadow:0 6px 0 #000; transition:transform .08s; }
  .lvl:hover { transform:translateY(-2px); }
  .lvl:active { transform:translateY(2px); }
  .lvl.active { background:var(--lego-blue); color:#fff; transform:translateY(2px); box-shadow:0 2px 0 #000; }
  .lvl.locked { opacity:.6; cursor:not-allowed; }

  /* Game area */
  .game { flex:1; display:grid; grid-template-columns:1fr .85fr; gap:clamp(10px,2vw,24px); min-height:0; }
  @media (max-width:1000px){ .game{grid-template-columns:1fr; grid-template-rows:1fr .9fr} }

  /* Build panel */
  .build { background:#fff; border:4px solid #000; border-radius:18px; padding:clamp(12px,2vw,24px); box-shadow:0 12px 0 #000; display:flex; flex-direction:column; min-height:0; }
  .build-title { font-size:clamp(18px,4.00vw,54px); font-weight:900; margin-bottom:10px; display:flex; align-items:center; gap:8px; }
  .sentence { display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:center; padding:16px 12px; border:3px dashed #ddd; border-radius:14px; background:#f8f9fa; min-height:90px; }
  .sentence .s-bubble { font-size:clamp(15px,2.88vw,40px); padding:6px 12px; border-radius:10px; background:#e9ecef; border:2px solid #000; font-weight:700; cursor:pointer; }
  .sentence .s-bubble.answer { background:var(--lego-yellow); }
  .sentence .s-bubble.gap { background:#fff; border-style:dashed; border-color:#ccc; min-width:90px; text-align:center; color:#ccc; }
  .sentence .s-bubble.correct { background:var(--lego-green); color:#fff; }
  .sentence .s-bubble.wrong { background:var(--lego-red); color:#fff; }
  .build-hint { font-size:clamp(14px,2.56vw,32px); color:var(--muted); text-align:center; margin-top:8px; font-weight:600; }

  .opts-wrap { flex:1; display:flex; flex-direction:column; justify-content:center; min-height:0; padding-top:16px; }
  .opts-title { font-size:clamp(14px,2.56vw,32px); font-weight:800; color:#000; margin-bottom:8px; text-align:center; }
  .opts { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; }
  .opt { display:flex; align-items:center; justify-content:center; }

  /* Lego block */
  .lego { position:relative; display:flex; align-items:center; justify-content:center; padding:clamp(8px,1.2vh,12px) clamp(14px,1.8vw,22px); font-size:clamp(16px,3.20vw,47px); font-weight:900; color:#fff; border:none; cursor:pointer; border-radius:12px; box-shadow:inset 0 -10px 0 rgba(0,0,0,.18), inset 0 10px 0 rgba(255,255,255,.18), 0 10px 0 #000; transition:transform .08s, box-shadow .08s; }
  .lego.red { background:var(--lego-red); }
  .lego.blue { background:var(--lego-blue); }
  .lego.yellow { background:var(--lego-yellow); color:#000; }
  .lego.green { background:var(--lego-green); }
  .lego.orange { background:var(--lego-orange); }
  .lego.purple { background:var(--lego-purple); }
  .lego:hover { transform:translateY(-3px); }
  .lego:active { transform:translateY(6px); box-shadow:inset 0 -10px 0 rgba(0,0,0,.18), inset 0 10px 0 rgba(255,255,255,.18), 0 4px 0 #000; }
  .lego:disabled { opacity:.6; cursor:not-allowed; transform:none; }

  .studs { position:absolute; top:-8px; left:50%; transform:translateX(-50%); display:flex; gap:8px; }
  .stud { width:16px; height:12px; border-radius:6px 6px 0 0; background:inherit; border:3px solid rgba(0,0,0,.12); border-bottom:none; box-shadow:inset 0 2px 0 rgba(255,255,255,.25); }

  /* Info panel */
  .info { background:#fff; border:4px solid #000; border-radius:18px; padding:clamp(12px,2vw,24px); box-shadow:0 12px 0 #000; display:flex; flex-direction:column; min-height:0; }
  .info-top { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:12px; flex-wrap:wrap; }
  .progress { flex:1; height:14px; background:#e9ecef; border-radius:100px; overflow:hidden; border:2px solid #000; }
  .progress-fill { height:100%; background:linear-gradient(90deg,var(--lego-green),#3fc070); border-radius:100px; transition:width .4s cubic-bezier(.4,0,.2,1); width:0%; }
  .trophy { font-size:clamp(22px,3vw,34px); }

  .info-body { flex:1; display:flex; flex-direction:column; justify-content:center; gap:12px; }
  .info-item { background:#f8f9fa; border:3px solid #000; border-radius:14px; padding:12px 16px; font-weight:800; display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .info-item .k { color:#000; }
  .info-item .v { color:var(--lego-red); font-size:clamp(16px,3.20vw,43px); }

  .next-row { display:flex; justify-content:center; margin-top:10px; }
  .next { background:var(--lego-green); color:#fff; }
  .next::before { content:''; position:absolute; top:-8px; left:50%; transform:translateX(-50%); width:48px; height:12px; border-radius:6px 6px 0 0; background:var(--lego-green); border:3px solid rgba(0,0,0,.12); border-bottom:none; box-shadow:inset 0 2px 0 rgba(255,255,255,.25); }

  /* Success modal */
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.5); display:none; align-items:center; justify-content:center; z-index:500; }
  .modal.show { display:flex; }
  .m-card { background:#fff; border:5px solid #000; border-radius:20px; padding:30px 40px; box-shadow:0 18px 0 #000; text-align:center; max-width:90vw; animation:scaleIn .3s cubic-bezier(.175,.885,.32,1.275); }
  @keyframes scaleIn { from{transform:scale(.8);opacity:0} to{transform:scale(1);opacity:1} }
  .m-emoji { font-size:clamp(50px,8vw,80px); margin-bottom:10px; }
  .m-title { font-size:clamp(24px,3.5vw,40px); font-weight:900; color:#000; margin-bottom:8px; }
  .m-sub { font-size:clamp(16px,3.20vw,43px); color:#555; margin-bottom:16px; font-weight:700; }
  .m-btns { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }

  /* Particles */
  .star { position:fixed; pointer-events:none; font-size:clamp(22px,3.5vw,40px); animation:starPop .8s ease-out forwards; z-index:999; }
  @keyframes starPop { 0%{transform:scale(0) rotate(0);opacity:1} 100%{transform:scale(1.6) rotate(200deg);opacity:0} }

</style>
</head>
<body>

<!-- Start -->
<div id="start">
  <div class="lego-logo">LEGO</div>
  <div class="sub-title">UNIT 5 BLOCK BUILDER</div>
  <div class="block-row">
    <div class="t-block red"></div>
    <div class="t-block blue"></div>
    <div class="t-block yellow"></div>
    <div class="t-block green"></div>
  </div>
  <div class="hint">点击任意处开始搭建句子积木</div>
</div>

<!-- Main UI -->
<div id="ui">
  <div class="top">
    <div class="chip"><span class="lab">得分</span><span class="val" id="score">0</span></div>
    <div class="chip"><span class="lab">连击</span><span class="val" id="combo">🔥 0</span></div>
    <div class="chip"><span class="lab">关卡</span><span class="val" id="level">1</span></div>
  </div>

  <div class="levels" id="levels"></div>

  <div class="game">
    <!-- Build -->
    <div class="build">
      <div class="build-title">🧱 搭句子</div>
      <div class="sentence" id="sentence"></div>
      <div class="build-hint" id="hint">选择正确的积木放入空白处</div>

      <div class="opts-wrap">
        <div class="opts-title">可选积木</div>
        <div class="opts" id="opts"></div>
      </div>
    </div>

    <!-- Info -->
    <div class="info">
      <div class="info-top">
        <div class="progress"><div class="progress-fill" id="pFill"></div></div>
        <div class="trophy" id="trophy">🏆 0</div>
      </div>
      <div class="info-body">
        <div class="info-item">
          <div class="k">💬 单元主题</div>
          <div class="v" style="color:var(--lego-blue)">Do you have a soccer ball?</div>
        </div>
        <div class="info-item">
          <div class="k">⚽ 当前关卡</div>
          <div class="v" id="lvlName">基础词汇</div>
        </div>
        <div class="info-item">
          <div class="k">✨ 最佳连击</div>
          <div class="v" id="best">0</div>
        </div>
        <div class="next-row">
          <button class="lego next" id="nextBtn" style="display:none">下一题 →</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Success Modal -->
<div class="modal" id="modal">
  <div class="m-card">
    <div class="m-emoji" id="mEmoji">🎉</div>
    <div class="m-title" id="mTitle">太棒了！</div>
    <div class="m-sub" id="mSub">你完成了这一关！</div>
    <div class="m-btns">
      <button class="lego green" id="againBtn">再玩一次</button>
      <button class="lego blue" id="nextLvlBtn">下一关</button>
    </div>
  </div>
</div>

<script>
/* ===================== Sound ===================== */
class SoundEngine {
  constructor(){ this.ctx=null; this.ready=false; }
  init(){ if(this.ready) return; try{ this.ctx=new(window.AudioContext||window.webkitAudioContext)(); this.ready=true; }catch(e){} }
  play(type){
    if(!this.ctx) return; const now=this.ctx.currentTime;
    switch(type){
      case 'click': this.tone(700,0.06,'sine',0.08,now); break;
      case 'place':
        this.tone(523,.08,'sine',.12,now); this.tone(659,.08,'sine',.12,now+.06); break;
      case 'correct':
        this.tone(523,.12,'sine',.18,now); this.tone(659,.12,'sine',.18,now+.08); this.tone(784,.18,'sine',.18,now+.16); break;
      case 'wrong':
        const o=this.ctx.createOscillator(),g=this.ctx.createGain(); o.connect(g); g.connect(this.ctx.destination); o.type='sawtooth'; o.frequency.setValueAtTime(200,now); o.frequency.linearRampToValueAtTime(100,now+.25); g.gain.setValueAtTime(.12,now); g.gain.exponentialRampToValueAtTime(.001,now+.25); o.start(now); o.stop(now+.25); break;
      case 'win': [523,659,784,1047,784,1047].forEach((f,i)=>this.tone(f,.3,'sine',.14,now+i*.14)); break;
      case 'pop': this.tone(900,.05,'sine',.08,now); break;
    }
  }
  tone(freq,dur,type,vol,t){
    const o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.connect(g); g.connect(this.ctx.destination); o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.start(t); o.stop(t+dur);
  }
}
const sound=new SoundEngine();

/* ===================== Data ===================== */
const LEVELS = [
  {
    name:'🏷️ 基础词汇',
    color:'red',
    questions:[
      {s:'Do you have a soccer ______?', opts:['ball','boll','bal'], a:0, hint:'soccer ball (足球)'},
      {s:'I have a ______ bat.', opts:['baseball','basketball','volleyball'], a:0, hint:'baseball bat (棒球棒)'},
      {s:'That ______ is mine.', opts:['basketball','ping-pong','tennis'], a:0},
      {s:'Let ______ play.', opts:['us','we','our'], a:0, hint:'Let us (让我们)'},
      {s:'That ______ good.', opts:['sounds','sound','soundes'], a:0},
      {s:'We go to ______ same school.', opts:['the','a','an'], a:0},
    ]
  },
  {
    name:'✅ 一般疑问句',
    color:'blue',
    questions:[
      {s:'______ you have a soccer ball?', opts:['Do','Does','Are'], a:0, hint:'第二人称用 Do'},
      {s:'______ she have a tennis ball?', opts:['Do','Does','Is'], a:1, hint:'第三人称用 Does'},
      {s:'— Do you have a bat? — Yes, I ______.', opts:['do','does','have'], a:0},
      {s:'— Does he have a basketball? — No, he ______.', opts:['don\'t','doesn\'t','do'], a:1},
      {s:'— ______ they have a volleyball? — Yes, they do.', opts:['Do','Does','Are'], a:0},
      {s:'— ______ your brother have a soccer ball? — No, he doesn\'t.', opts:['Do','Does','Is'], a:1},
    ]
  },
  {
    name:'🗣️ 让我们...',
    color:'yellow',
    questions:[
      {s:'Let ______ play basketball.', opts:['us','we','our'], a:0, hint:'Let us 后接宾格'},
      {s:'Let\'s ______!', opts:['go','goes','going'], a:0, hint:'Let\'s 后接动词原形'},
      {s:'Let\'s play soccer. That ______ great.', opts:['sounds','sound','soundes'], a:0},
      {s:'Let\'s ______ TV.', opts:['watch','watches','watching'], a:0, hint:'watch TV (看电视)'},
      {s:'Let ______ go to the library.', opts:['us','we','are'], a:0},
      {s:'Let\'s ______ computer games.', opts:['play','plays','playing'], a:0},
    ]
  },
  {
    name:'🔗 并列与转折',
    color:'green',
    questions:[
      {s:'I like soccer, ______ I don\'t have a ball.', opts:['but','and','or'], a:0, hint:'转折用 but'},
      {s:'He has a basketball ______ a volleyball.', opts:['and','but','or'], a:1?1:0, hint:'并列用 and'}, // 修正语法: a:0
      {s:'We go to the same school, ______ we love sports.', opts:['and','but','so'], a:0},
      {s:'She loves sports, ______ she doesn\'t play them.', opts:['but','and','or'], a:0},
      {s:'I have a ping-pong bat, ______ my friend has a ball.', opts:['and','but','or'], a:0},
      {s:'Do you have a basketball ______ a soccer ball?', opts:['or','and','but'], a:0, hint:'选择用 or'},
    ]
  },
  {
    name:'🌟 综合挑战',
    color:'purple',
    questions:[
      {s:'______ you have a baseball?', opts:['Do','Does','Are'], a:0},
      {s:'______ your sister have a tennis ball?', opts:['Do','Does','Is'], a:1},
      {s:'Let ______ play ping-pong.', opts:['us','we','our'], a:0},
      {s:'That ______ interesting.', opts:['sounds','sound','soundes'], a:0},
      {s:'I like sports, ______ I don\'t have a soccer ball.', opts:['but','and','or'], a:0},
      {s:'We go to ______ same school.', opts:['the','a','an'], a:0},
    ]
  },
];

/* 修正上面的 typo */
LEVELS[3].questions[1].a=0;

/* ===================== State ===================== */
let state = { level:0, q:0, score:0, combo:0, best:0, waiting:false };

/* ===================== DOM ===================== */
const startEl=document.getElementById('start');
const uiEl=document.getElementById('ui');
const sentenceEl=document.getElementById('sentence');
const optsEl=document.getElementById('opts');
const hintEl=document.getElementById('hint');
const scoreEl=document.getElementById('score');
const comboEl=document.getElementById('combo');
const levelEl=document.getElementById('level');
const lvlNameEl=document.getElementById('lvlName');
const bestEl=document.getElementById('best');
const pFillEl=document.getElementById('pFill');
const trophyEl=document.getElementById('trophy');
const levelsEl=document.getElementById('levels');
const nextBtn=document.getElementById('nextBtn');
const modal=document.getElementById('modal');
const mEmoji=document.getElementById('mEmoji');
const mTitle=document.getElementById('mTitle');
const mSub=document.getElementById('mSub');
const againBtn=document.getElementById('againBtn');
const nextLvlBtn=document.getElementById('nextLvlBtn');

/* ===================== Init ===================== */
function init(){
  buildLevelSelect();
  loadLevel(0);
}

function buildLevelSelect(){
  levelsEl.innerHTML='';
  LEVELS.forEach((lvl,i)=>{
    const btn=document.createElement('button');
    btn.className='lvl'+(i===state.level?' active':'');
    btn.textContent=lvl.name;
    if(i>state.level+2) btn.classList.add('locked');
    btn.addEventListener('click',()=>{
      sound.init(); sound.play('click');
      if(i>state.level+2) return;
      loadLevel(i);
    });
    levelsEl.appendChild(btn);
  });
}

function loadLevel(lvlIdx){
  state.level=lvlIdx; state.q=0;
  const lvl=LEVELS[lvlIdx];
  levelEl.textContent=lvlIdx+1;
  lvlNameEl.textContent=lvl.name;
  pFillEl.style.width='0%';
  trophyEl.textContent='🏆 0';
  updateUI();
  loadQuestion(0);
  buildLevelSelect();
}

function loadQuestion(qIdx){
  state.q=qIdx; state.waiting=false;
  nextBtn.style.display='none';
  const lvl=LEVELS[state.level];
  const q=lvl.questions[qIdx];
  const color=lvl.color;

  // split sentence into parts around the blank
  const before=q.s.split('______')[0].trim();
  const after=q.s.split('______')[1]?.trim()||'';
  sentenceEl.innerHTML='';
  if(before){
    const b=document.createElement('div'); b.className='s-bubble'; b.textContent=before;
    sentenceEl.appendChild(b);
  }
  const gap=document.createElement('div'); gap.className='s-bubble gap'; gap.textContent='?'; gap.id='gap';
  sentenceEl.appendChild(gap);
  if(after){
    const a=document.createElement('div'); a.className='s-bubble'; a.textContent=after;
    sentenceEl.appendChild(a);
  }

  hintEl.textContent=q.hint?('💡 '+q.hint):'选择正确的积木放入空白处';

  // options
  optsEl.innerHTML='';
  const shuffled=q.opts.map((o,i)=>({t:o,i:i})).sort(()=>Math.random()-.5);
  const colors=['red','blue','yellow','green','orange','purple'];
  shuffled.forEach((opt,idx)=>{
    const wrap=document.createElement('div'); wrap.className='opt';
    const btn=document.createElement('button'); btn.className='lego '+colors[idx%colors.length];
    btn.innerHTML=`<span class="studs"><span class="stud"></span>${opt.t.length>=6?'<span class="stud"></span>':''}</span>${opt.t}`;
    btn.dataset.answerIdx=opt.i;
    btn.addEventListener('click',()=>tryAnswer(opt.i,btn));
    wrap.appendChild(btn);
    optsEl.appendChild(wrap);
  });
}

function tryAnswer(idx,btn){
  if(state.waiting) return;
  state.waiting=true;
  sound.init(); sound.play('place');

  const lvl=LEVELS[state.level];
  const q=lvl.questions[state.q];
  const correct=idx===q.a;

  const gap=document.getElementById('gap');
  gap.textContent=q.opts[idx];
  gap.classList.remove('gap');
  gap.classList.add('answer');

  optsEl.querySelectorAll('.lego').forEach(b=>b.disabled=true);

  if(correct){
    gap.classList.add('correct');
    sound.play('correct');
    state.combo++;
    if(state.combo>state.best) state.best=state.combo;
    let pts=10; if(state.combo>=3) pts=15; if(state.combo>=5) pts=20;
    state.score+=pts;
    spawnStars();
    nextBtn.style.display='inline-flex';
    nextBtn.textContent='下一题 →';
    hintEl.textContent='🎉 太棒了！'+(state.combo>=3?(' 连击 x'+state.combo+'!'):'');
  }else{
    gap.classList.add('wrong');
    sound.play('wrong');
    state.combo=0;
    // show correct
    const showCorrect=()=>{
      setTimeout(()=>{
        const correctText=q.opts[q.a];
        gap.textContent=correctText; gap.classList.remove('wrong'); gap.classList.add('correct');
      },600);
    };
    showCorrect();
    nextBtn.style.display='inline-flex';
    nextBtn.textContent='继续';
    hintEl.textContent='😅 记住：'+(q.hint||'下次就会了！');
  }

  updateUI();
  pFillEl.style.width=((state.q+1)/lvl.questions.length*100)+'%';
  trophyEl.textContent='🏆 '+Math.floor((state.q+1)/lvl.questions.length*10);
}

/* ===================== Controls ===================== */
nextBtn.addEventListener('click',()=>{
  sound.init(); sound.play('click');
  const lvl=LEVELS[state.level];
  if(state.q+1 >= lvl.questions.length){
    // level complete
    sound.play('win');
    mEmoji.textContent='🎉';
    mTitle.textContent='关卡完成！';
    mSub.textContent='你获得 '+state.score+' 分，最高连击 '+state.best+'!';
    nextLvlBtn.style.display=state.level+1 < LEVELS.length?'inline-flex':'none';
    modal.classList.add('show');
  }else{
    loadQuestion(state.q+1);
  }
});

againBtn.addEventListener('click',()=>{
  sound.init(); sound.play('click');
  modal.classList.remove('show');
  loadLevel(state.level);
});

nextLvlBtn.addEventListener('click',()=>{
  sound.init(); sound.play('click');
  modal.classList.remove('show');
  loadLevel(state.level+1);
});

/* ===================== UI update ===================== */
function updateUI(){
  scoreEl.textContent=state.score;
  comboEl.textContent='🔥 '+state.combo;
  bestEl.textContent=state.best;
  const btns=levelsEl.querySelectorAll('.lvl');
  btns.forEach((b,i)=>{
    b.classList.toggle('active',i===state.level);
    b.classList.toggle('locked',i>state.level+2);
  });
}

/* ===================== Effects ===================== */
function spawnStars(){
  const rect=sentenceEl.getBoundingClientRect();
  for(let i=0;i<10;i++){
    const s=document.createElement('div'); s.className='star';
    s.textContent=['⭐','✨','🌟','💫'][Math.floor(Math.random()*4)];
    s.style.left=(rect.left+Math.random()*rect.width)+'px';
    s.style.top=(rect.top+Math.random()*rect.height)+'px';
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),800);
  }
}

/* ===================== Start ===================== */
startEl.addEventListener('click',()=>{
  sound.init(); sound.play('click');
  startEl.classList.add('hidden');
  uiEl.style.display='flex';
  init();
});

/* Keyboard support */
window.addEventListener('keydown',(e)=>{
  if(!startEl.classList.contains('hidden')){
    startEl.click(); return;
  }
  if(e.key===' '||e.key==='Enter'){
    if(nextBtn.style.display!=='none') nextBtn.click();
  }
  const optBtns=optsEl.querySelectorAll('.lego');
  if(/^[1-6]$/.test(e.key)){
    const idx=parseInt(e.key)-1;
    if(optBtns[idx]) optBtns[idx].click();
  }
});

</script>
</body>
</html>

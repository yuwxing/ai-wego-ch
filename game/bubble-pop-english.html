<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>泡泡英语 - 关卡版 ✨ 支持自定义词库</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  background:linear-gradient(180deg,#0b2248 0%,#1b3b6b 40%,#2d7abf 70%,#6ec6ff 100%);
  min-height:100vh;display:flex;justify-content:center;align-items:center;overflow:hidden;
  padding:10px;
}
.stars{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0}
.star{position:absolute;border-radius:50%;background:white;animation:twinkle 3s infinite alternate}
@keyframes twinkle{0%{opacity:.15}100%{opacity:.9}}

.game-wrap{
  position:relative;z-index:1;
  width:520px;max-width:100%;
  background:rgba(255,255,255,.07);backdrop-filter:blur(14px);
  border-radius:32px;padding:18px 16px 22px;
  border:1px solid rgba(255,255,255,.15);
  box-shadow:0 20px 60px rgba(0,0,0,.5);
}

.top-bar{display:flex;justify-content:space-between;align-items:center;padding:0 4px 10px;color:white;gap:6px}
.top-bar .box{background:rgba(255,255,255,.1);backdrop-filter:blur(4px);border-radius:12px;padding:5px 12px;font-size:13px;font-weight:600;white-space:nowrap}
.top-bar .box span{font-size:18px;margin-left:3px}
.level-box{color:#7dd3fc}.score-box{color:#fbbf24}
.combo-box{color:#fb923c;min-width:55px;text-align:center;display:none}
.combo-box.active{display:block;animation:pulse-c .3s}
@keyframes pulse-c{50%{transform:scale(1.2)}}
.lives-box{color:#fca5a5}

.timer-wrap{padding:0 4px 6px}
.timer-bar{height:8px;border-radius:6px;background:rgba(255,255,255,.15);overflow:hidden}
.timer-fill{height:100%;border-radius:6px;width:100%;background:linear-gradient(90deg,#22d3ee,#06b6d4);transition:width .3s linear}
.timer-fill.danger{background:linear-gradient(90deg,#f87171,#ef4444)}
.timer-fill.caution{background:linear-gradient(90deg,#fbbf24,#f59e0b)}
.timer-text{text-align:center;color:rgba(255,255,255,.5);font-size:11px;margin-top:3px}

.prompt-area{text-align:center;padding:12px 0 6px;color:white}
.prompt-label{font-size:12px;opacity:.55;margin-bottom:2px}
.prompt-word{font-size:34px;font-weight:700;letter-spacing:2px;text-shadow:0 2px 12px rgba(0,0,0,.4);min-height:44px}
.prompt-hint{font-size:13px;opacity:.5;margin-top:3px;min-height:18px}

.bubble-field{position:relative;width:100%;height:360px;margin:4px 0;border-radius:18px;cursor:pointer;background:radial-gradient(ellipse at 50% 100%,rgba(64,169,255,.18),transparent 70%)}
.bubble{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:white;text-align:center;cursor:pointer;user-select:none;transition:transform .12s;word-break:break-word;padding:4px}
.bubble:hover{transform:scale(1.08)}.bubble:active{transform:scale(.92)}
.bubble.correct{animation:pop-correct .45s forwards}
@keyframes pop-correct{0%{transform:scale(1);opacity:1}30%{transform:scale(1.25)}100%{transform:scale(0);opacity:0}}
.bubble.wrong{animation:pop-wrong .5s forwards}
@keyframes pop-wrong{0%{transform:scale(1);opacity:1}100%{transform:scale(0);opacity:0}}
.float-score{position:absolute;font-size:26px;font-weight:800;color:#ffd700;pointer-events:none;animation:float-up .9s forwards;text-shadow:0 0 10px rgba(255,215,0,.6);z-index:10}
@keyframes float-up{0%{opacity:1;transform:translateY(0) scale(.8)}100%{opacity:0;transform:translateY(-80px) scale(.9)}}
.particle{position:absolute;border-radius:50%;pointer-events:none;z-index:15;animation:burst .7s forwards}
@keyframes burst{0%{opacity:1}100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(0)}}

.btns{display:flex;justify-content:center;gap:8px;padding-top:10px;flex-wrap:wrap}
.btn{
  padding:9px 20px;border:none;border-radius:14px;font-size:14px;font-weight:700;cursor:pointer;
  transition:transform .12s;color:white;white-space:nowrap;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.3)}
.btn:active{transform:scale(.95)}
.btn-pri{background:linear-gradient(135deg,#f7971e,#ffd200);color:#333}
.btn-sec{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2)}
.btn-edit{background:rgba(167,139,250,.3);border:1px solid rgba(167,139,250,.4)}
.btn-edit:hover{background:rgba(167,139,250,.5)}

/* 遮罩层 */
.mask{
  position:absolute;top:0;left:0;right:0;bottom:0;z-index:50;border-radius:18px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(0,0,0,.6);backdrop-filter:blur(10px);color:white;text-align:center;padding:24px;
}
.mask h2{font-size:26px;margin-bottom:6px}.mask p{font-size:14px;opacity:.75;margin-bottom:16px;line-height:1.6}
.hidden{display:none!important}
.result-score{font-size:52px;font-weight:800;color:#ffd700;margin:8px 0}
.result-sub{font-size:13px;opacity:.6}
.result-msg{font-size:16px;margin-top:8px}
.result-stars{font-size:36px;margin:6px 0}
.big-lv{font-size:64px;font-weight:800;color:#7dd3fc}

/* 词库编辑器 */
.editor-panel{
  position:absolute;top:0;left:0;right:0;bottom:0;z-index:60;border-radius:18px;
  display:flex;flex-direction:column;padding:20px;
  background:rgba(15,23,42,.95);backdrop-filter:blur(16px);color:white;
}
.editor-panel h3{font-size:18px;margin-bottom:4px;text-align:center}
.editor-panel .sub{font-size:12px;opacity:.6;text-align:center;margin-bottom:12px}
.editor-panel textarea{
  flex:1;width:100%;min-height:160px;border-radius:12px;border:1px solid rgba(255,255,255,.15);
  background:rgba(255,255,255,.05);color:white;padding:12px;font-size:13px;font-family:monospace;resize:vertical;
  line-height:1.7;
}
.editor-panel textarea::placeholder{color:rgba(255,255,255,.25)}
.editor-panel .info{font-size:11px;opacity:.45;margin-top:6px;text-align:center}
.editor-panel .editor-btns{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap}

.source-badge{
  display:inline-block;font-size:10px;padding:2px 8px;border-radius:10px;
  background:rgba(255,255,255,.1);color:rgba(255,255,255,.5);margin-left:4px;vertical-align:middle;
}
.source-badge.custom{background:rgba(251,191,36,.2);color:#fbbf24}

@media(max-width:500px){
  .game-wrap{padding:14px 10px 16px;border-radius:24px;max-height:98vh;overflow-y:auto}
  .bubble-field{height:280px}
  .prompt-word{font-size:26px}
  .top-bar .box{font-size:12px;padding:4px 8px;flex-shrink:0}
  .top-bar .box span{font-size:15px}
  .editor-panel{padding:14px}
  .editor-panel textarea{min-height:120px}
}
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<div class="game-wrap" style="position:relative">
  <div class="top-bar">
    <div class="box level-box">🎯 第 <span id="levelDisplay">1</span> 关 <span class="source-badge" id="srcBadge">内置</span></div>
    <div class="box score-box">🏆 <span id="scoreDisplay">0</span></div>
    <div class="box combo-box" id="comboDisplay">🔥 <span id="comboCount">0</span>x</div>
    <div class="box lives-box">❤️ <span id="livesDisplay">3</span></div>
  </div>

  <div class="timer-wrap">
    <div class="timer-bar"><div class="timer-fill" id="timerFill"></div></div>
    <div class="timer-text">⏱ <span id="timerDisplay">60</span>s</div>
  </div>

  <div class="prompt-area">
    <div class="prompt-label">📖 选出正确的英文单词</div>
    <div class="prompt-word" id="promptWord">——</div>
    <div class="prompt-hint" id="promptHint"></div>
  </div>

  <div class="bubble-field" id="bubbleField"></div>

  <div class="btns">
    <button class="btn btn-pri" id="startBtn">🎮 开始游戏</button>
    <button class="btn btn-edit" id="editBtn">📝 编辑词库</button>
  </div>

  <!-- 开始遮罩 -->
  <div class="mask" id="startOverlay">
    <h2>🎈 泡泡英语</h2>
    <p>看中文 → 点英文泡泡 → 连击加分<br>
    每关 <strong>60秒</strong>，达到目标分即可过关<br>
    答错扣命，3条命用尽则游戏结束</p>
    <button class="btn btn-pri" id="startBtn2" style="font-size:17px;padding:12px 40px">开始游戏</button>
    <p style="font-size:12px;opacity:.5;margin-top:10px">💡 点击下方"编辑词库"可使用课本词汇</p>
  </div>
  <!-- 结束遮罩 -->
  <div class="mask hidden" id="endOverlay">
    <h2 id="endTitle">游戏结束</h2>
    <div class="result-sub">最终得分</div>
    <div class="result-score" id="finalScore">0</div>
    <div class="result-stars" id="resultStars"></div>
    <div class="result-msg" id="endMessage"></div>
    <button class="btn btn-pri" id="restartFromEndBtn" style="margin-top:10px">再来一局</button>
  </div>
  <!-- 关卡过渡 -->
  <div class="mask hidden" id="levelTransition">
    <p>🎉 过关！</p>
    <div class="big-lv" id="nextLevelNum">2</div>
    <p>第 <span id="nextLevelLabel">2</span> 关</p>
    <div style="margin-top:10px;font-size:13px;opacity:.7" id="levelDesc">难度提升</div>
    <button class="btn btn-pri" id="continueBtn" style="margin-top:14px">继续 ➜</button>
  </div>

  <!-- 词库编辑器 -->
  <div class="editor-panel hidden" id="editorPanel">
    <h3>📝 自定义词库</h3>
    <p class="sub">每行一组，中文=英文，游戏将使用你的词汇表</p>
    <textarea id="wordInput" placeholder="苹果=apple&#10;香蕉=banana&#10;猫=cat&#10;狗=dog&#10;书=book&#10;...(至少6组词才能玩)"></textarea>
    <p class="info">至少输入6组词 · 编辑后点击"保存并应用"即可开始游戏</p>
    <div class="editor-btns">
      <button class="btn btn-pri" id="saveWordsBtn">💾 保存并应用</button>
      <button class="btn btn-sec" id="resetWordsBtn">↩️ 恢复内置词库</button>
      <button class="btn btn-sec" id="closeEditorBtn">✕ 关闭</button>
    </div>
  </div>
</div>

<script>
// ========== 内置词库 ==========
const BUILTIN_WORDS = [
  {zh:"苹果",en:"apple"},{zh:"猫",en:"cat"},{zh:"狗",en:"dog"},{zh:"鱼",en:"fish"},
  {zh:"书",en:"book"},{zh:"蛋糕",en:"cake"},{zh:"门",en:"door"},{zh:"鸡蛋",en:"egg"},
  {zh:"花",en:"flower"},{zh:"草",en:"grass"},{zh:"帽子",en:"hat"},{zh:"月亮",en:"moon"},
  {zh:"太阳",en:"sun"},{zh:"树",en:"tree"},{zh:"水",en:"water"},{zh:"风筝",en:"kite"},
  {zh:"牛奶",en:"milk"},{zh:"灯",en:"lamp"},{zh:"笔",en:"pen"},{zh:"床",en:"bed"},
  {zh:"红色",en:"red"},{zh:"蓝色",en:"blue"},{zh:"大的",en:"big"},{zh:"小的",en:"small"},
  {zh:"鸟",en:"bird"},{zh:"球",en:"ball"},{zh:"男孩",en:"boy"},{zh:"女孩",en:"girl"},
  {zh:"手",en:"hand"},{zh:"头",en:"head"},{zh:"眼睛",en:"eye"},{zh:"嘴",en:"mouth"},
  {zh:"香蕉",en:"banana"},{zh:"大象",en:"elephant"},{zh:"长颈鹿",en:"giraffe"},
  {zh:"老师",en:"teacher"},{zh:"学生",en:"student"},{zh:"快乐",en:"happy"},
  {zh:"雨伞",en:"umbrella"},{zh:"熊猫",en:"panda"},{zh:"兔子",en:"rabbit"},
  {zh:"黄色",en:"yellow"},{zh:"礼物",en:"gift"},{zh:"微笑",en:"smile"},
  {zh:"朋友",en:"friend"},{zh:"家庭",en:"family"},{zh:"食物",en:"food"},
  {zh:"美丽的",en:"beautiful"},{zh:"重要的",en:"important"},{zh:"有趣的",en:"interesting"},
  {zh:"美味的",en:"delicious"},{zh:"困难的",en:"difficult"},{zh:"知识",en:"knowledge"},
  {zh:"科学",en:"science"},{zh:"历史",en:"history"},{zh:"国家",en:"country"},
  {zh:"城市",en:"city"},{zh:"河流",en:"river"},{zh:"山脉",en:"mountain"},
  {zh:"季节",en:"season"},{zh:"春天",en:"spring"},{zh:"夏天",en:"summer"},
  {zh:"秋天",en:"autumn"},{zh:"冬天",en:"winter"},{zh:"冒险",en:"adventure"},
  {zh:"生日",en:"birthday"},{zh:"巧克力",en:"chocolate"},{zh:"字典",en:"dictionary"},
  {zh:"教育",en:"education"},{zh:"著名的",en:"famous"},{zh:"健康的",en:"healthy"},
  {zh:"信息",en:"information"},{zh:"语言",en:"language"},{zh:"记忆",en:"memory"},
  {zh:"自然",en:"nature"},{zh:"机会",en:"opportunity"},{zh:"问题",en:"question"},
  {zh:"特别的",en:"special"},{zh:"天气",en:"weather"},{zh:"练习",en:"exercise"},
];

const LEVEL_CONFIG = [
  {level:1,targetScore:30,time:60},{level:2,targetScore:40,time:60},
  {level:3,targetScore:50,time:60},{level:4,targetScore:60,time:55},
  {level:5,targetScore:80,time:50},
];

// ========== 词库管理 ==========
let customWords = null; // null = use built-in

function loadCustomWords(){
  try{
    const saved = localStorage.getItem('bubbleWords');
    if(saved){customWords = JSON.parse(saved); return true;}
  }catch(e){}
  return false;
}
function saveCustomWords(words){
  try{
    localStorage.setItem('bubbleWords',JSON.stringify(words));
    customWords = words;
  }catch(e){}
}

function getActiveWords(){
  if(customWords && customWords.length >= 6) return customWords;
  return BUILTIN_WORDS;
}

function parseWordsInput(text){
  const lines = text.split('\n').map(l=>l.trim()).filter(l=>l);
  const words = [];
  for(const line of lines){
    const sep = line.includes('=') ? '=' : line.includes('，') ? '，' : line.includes(',') ? ',' : null;
    if(!sep) continue;
    const parts = line.split(sep);
    if(parts.length>=2){
      const zh = parts[0].trim(), en = parts[1].trim();
      if(zh && en) words.push({zh, en});
    }
  }
  return words;
}

// ========== 状态 ==========
let score=0,lives=3,combo=0,level=1,roundScore=0;
let timeLeft=60,timerInt=null;
let isPlaying=false,isTransitioning=false;
let currentBubbles=[],floatId=null;
let usedIndices=[];
const BUBBLE_COUNT=6;

const $=id=>document.getElementById(id);
const promptWord=$('promptWord'),promptHint=$('promptHint');
const scoreDisp=$('scoreDisplay'),livesDisp=$('livesDisplay');
const levelDisp=$('levelDisplay'),comboDisp=$('comboDisplay'),comboCount=$('comboCount');
const timerFill=$('timerFill'),timerDisp=$('timerDisplay');
const bubbleField=$('bubbleField'),srcBadge=$('srcBadge');
const startOverlay=$('startOverlay'),endOverlay=$('endOverlay'),levelTrans=$('levelTransition');
const finalScore=$('finalScore'),endMessage=$('endMessage'),endTitle=$('endTitle'),resultStars=$('resultStars');
const editorPanel=$('editorPanel'),wordInput=$('wordInput');

// ========== 星星 ==========
(()=>{const c=$('stars');for(let i=80;i--;){const s=document.createElement('div');s.className='star';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*70+'%';s.style.width=s.style.height=(1+Math.random()*2)+'px';s.style.animationDelay=Math.random()*3+'s';s.style.animationDuration=(1.5+Math.random()*2)+'s';c.appendChild(s)}})();

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function adjColor(h,a){const n=parseInt(h.slice(1),16);return `rgb(${Math.max(0,Math.min(255,(n>>16)+a))},${Math.max(0,Math.min(255,((n>>8)&0xff)+a))},${Math.max(0,Math.min(255,(n&0xff)+a))})`}

function getLevelConfig(){return LEVEL_CONFIG.find(l=>l.level===level)||LEVEL_CONFIG[LEVEL_CONFIG.length-1]}

// 根据关卡和词库切分难度
function getWordsForLevel(){
  const pool = getActiveWords();
  const easy = pool.filter(w=>w.en.length<=4);
  const medium = pool.filter(w=>w.en.length>=5&&w.en.length<=7);
  const hard = pool.filter(w=>w.en.length>=8);
  if(level===1 && easy.length>=BUBBLE_COUNT) return easy;
  if(level===2 && easy.concat(medium).length>=BUBBLE_COUNT) return shuffle(easy.concat(medium));
  if(level===3) return pool;
  if(level===4 && medium.concat(hard).length>=BUBBLE_COUNT) return shuffle(medium.concat(hard));
  return pool;
}

function pickWords(){
  const pool = getWordsForLevel();
  const av = pool.filter((_,i)=>!usedIndices.includes(i));
  const use = av.length>=BUBBLE_COUNT?av:pool;
  if(av.length<BUBBLE_COUNT) usedIndices=[];
  const correct = use[Math.floor(Math.random()*use.length)];
  usedIndices.push(pool.indexOf(correct));
  const usedEn = new Set([correct.en]);
  const others = shuffle(pool.filter(w=>!usedEn.has(w.en)));
  const dist=[];
  for(const w of others){if(dist.length>=BUBBLE_COUNT-1)break;if(!usedEn.has(w.en)){dist.push(w);usedEn.add(w.en)}}
  const colors=['#FF6B6B','#4ECDC4','#45B7D1','#96CEB4','#FFEAA7','#DDA0DD','#FF8C94','#A8E6CF','#FFD93D','#6BCB77','#4D96FF','#FF6B35'];
  return shuffle([correct,...dist]).map((w,i)=>({
    word:w, isCorrect:w.en===correct.en,
    color:colors[i%colors.length], x:0,y:0,r:0,vx:0,vy:0
  }));
}

function layoutBubbles(bubbles){
  const w=bubbleField.clientWidth||480,h=bubbleField.clientHeight||360,pad=8;
  const sizes=bubbles.map(b=>{const l=b.word.en.length;return l<=3?36+Math.random()*6:l<=5?40+Math.random()*6:l<=7?44+Math.random()*6:48+Math.random()*6});
  const cols=3,rows=Math.ceil(bubbles.length/cols),cw=(w-pad*2)/cols,ch=(h-pad*2)/rows;
  bubbles.forEach((b,i)=>{
    b.r=sizes[i];const col=i%cols,row=Math.floor(i/cols);
    b.x=Math.max(b.r,Math.min(w-b.r,pad+cw*col+cw/2+(Math.random()-.5)*cw*.35));
    b.y=Math.max(b.r,Math.min(h-b.r,pad+ch*row+ch/2+(Math.random()-.5)*ch*.35));
    b.vx=(Math.random()-.5)*.25;b.vy=(Math.random()-.5)*.25;
  });
}

function renderBubbles(bubbles){
  bubbleField.innerHTML='';
  bubbles.forEach((b,i)=>{
    const el=document.createElement('div');el.className='bubble';el.dataset.idx=i;
    el.textContent=b.word.en;
    el.style.width=el.style.height=b.r*2+'px';el.style.left=(b.x-b.r)+'px';el.style.top=(b.y-b.r)+'px';
    el.style.background=`radial-gradient(circle at 35% 30%,rgba(255,255,255,.4),${b.color} 70%,${adjColor(b.color,-30)})`;
    el.style.boxShadow=`0 6px 20px ${b.color}66, inset 0 -4px 8px rgba(0,0,0,.15)`;
    el.style.fontSize=Math.max(12,Math.min(18,b.r*.36))+'px';el.style.border='2px solid rgba(255,255,255,.25)';
    el.addEventListener('click',e=>onBubbleClick(i,e));bubbleField.appendChild(el);
  });
}

function startFloat(bubbles){
  if(floatId)cancelAnimationFrame(floatId);let r=true;
  function step(){if(!r)return;const fw=bubbleField.clientWidth||480,fh=bubbleField.clientHeight||360;bubbles.forEach((b,i)=>{b.x+=b.vx;b.y+=b.vy;if(b.x-b.r<0){b.x=b.r;b.vx*=-1}if(b.x+b.r>fw){b.x=fw-b.r;b.vx*=-1}if(b.y-b.r<0){b.y=b.r;b.vy*=-1}if(b.y+b.r>fh){b.y=fh-b.r;b.vy*=-1}const el=bubbleField.querySelector(`.bubble[data-idx="${i}"]`);if(el&&!el.classList.contains('correct')&&!el.classList.contains('wrong')){el.style.left=(b.x-b.r)+'px';el.style.top=(b.y-b.r)+'px'}});floatId=requestAnimationFrame(step)}
  floatId=requestAnimationFrame(step);return ()=>{r=false}
}
function stopFloat(){if(floatId){cancelAnimationFrame(floatId);floatId=null}}

function createParticles(x,y,color,n=12){for(let i=n;i--;){const p=document.createElement('div');p.className='particle';const s=4+Math.random()*8;p.style.width=p.style.height=s+'px';p.style.background=color;p.style.left=x+'px';p.style.top=y+'px';p.style.setProperty('--tx',(Math.random()-.5)*120+'px');p.style.setProperty('--ty',(Math.random()-.5)*120+'px');bubbleField.appendChild(p);setTimeout(()=>p.remove(),800)}}
function showFloat(x,y,t,c='#ffd700'){const el=document.createElement('div');el.className='float-score';el.textContent=t;el.style.left=x+'px';el.style.top=y+'px';el.style.color=c;bubbleField.appendChild(el);setTimeout(()=>el.remove(),1000)}

function startTimer(){
  clearInterval(timerInt);const cfg=getLevelConfig();timeLeft=cfg.time;updateTimerUI();
  timerInt=setInterval(()=>{timeLeft--;updateTimerUI();if(timeLeft<=0){clearInterval(timerInt);handleTimeUp()}},1000);
}
function updateTimerUI(){
  timerDisp.textContent=timeLeft;const cfg=getLevelConfig();const pct=Math.max(0,timeLeft/cfg.time*100);
  timerFill.style.width=pct+'%';timerFill.className='timer-fill'+(timeLeft<=10?' danger':timeLeft<=20?' caution':'');
}
function stopTimer(){clearInterval(timerInt)}
function handleTimeUp(){if(!isPlaying)return;stopTimer();stopFloat();bubbleField.innerHTML='';checkLevelResult()}

function onBubbleClick(idx,evt){
  if(!isPlaying||isTransitioning)return;
  const b=currentBubbles[idx];const el=bubbleField.querySelector(`.bubble[data-idx="${idx}"]`);
  if(!el||el.classList.contains('correct')||el.classList.contains('wrong'))return;
  const rect=el.getBoundingClientRect(),fRect=bubbleField.getBoundingClientRect();
  const cx=rect.left-fRect.left+rect.width/2,cy=rect.top-fRect.top+rect.height/2;
  if(b.isCorrect){
    el.classList.add('correct');combo++;const earned=10+Math.min(combo-1,5)*2;
    score+=earned;roundScore+=earned;updateUI();
    createParticles(cx,cy,b.color,16);showFloat(cx-20,cy-20,`+${earned}`,'#ffd700');
    if(combo>=2){showFloat(cx+10,cy-50,`🔥 ${combo}x`,'#ff6b6b');comboDisp.classList.add('active');comboCount.textContent=combo}
    setTimeout(()=>nextRound(),600);
  }else{
    el.classList.add('wrong');combo=0;lives--;comboDisp.classList.remove('active');updateUI();
    showFloat(cx-15,cy-15,'✘','#ff4444');createParticles(cx,cy,'#ff4444',8);
    if(lives<=0){setTimeout(()=>endGame(false),500)}else{setTimeout(()=>nextRound(),700)}
  }
}
function nextRound(){if(!isPlaying||lives<=0)return;loadRound()}
function loadRound(){
  if(lives<=0||!isPlaying)return;bubbleField.innerHTML='';currentBubbles=pickWords();
  const correct=currentBubbles.find(b=>b.isCorrect).word;
  layoutBubbles(currentBubbles);renderBubbles(currentBubbles);
  promptWord.textContent=correct.zh;promptHint.textContent=`共 ${correct.en.length} 个字母`;
  stopFloat();startFloat(currentBubbles);
}

function checkLevelResult(){
  if(!isPlaying)return;const cfg=getLevelConfig();
  if(roundScore>=cfg.targetScore){if(level>=5){endGame(true)}else{showLevelTransition()}}
  else{endGame(false)}
}
function showLevelTransition(){
  isTransitioning=true;stopFloat();stopTimer();bubbleField.innerHTML='';
  $('nextLevelNum').textContent=level+1;$('nextLevelLabel').textContent=level+1;
  const nextCfg=LEVEL_CONFIG.find(l=>l.level===level+1);
  $('levelDesc').textContent=nextCfg?`目标分 ${nextCfg.targetScore}，限时 ${nextCfg.time}s`:'最终关！';
  levelTrans.classList.remove('hidden');
}

function updateUI(){scoreDisp.textContent=score;livesDisp.textContent=lives;levelDisp.textContent=level}

function startGame(){
  score=0;lives=3;combo=0;level=1;roundScore=0;usedIndices=[];isPlaying=true;isTransitioning=false;
  comboDisp.classList.remove('active');
  startOverlay.classList.add('hidden');endOverlay.classList.add('hidden');levelTrans.classList.add('hidden');editorPanel.classList.add('hidden');
  stopFloat();stopTimer();bubbleField.innerHTML='';
  const isCustom=customWords&&customWords.length>=6;
  srcBadge.textContent=isCustom?'自定义':'内置';srcBadge.className='source-badge'+(isCustom?' custom':'');
  updateUI();startTimer();loadRound();
}
function startNextLevel(){
  level++;roundScore=0;combo=0;usedIndices=[];comboDisp.classList.remove('active');
  levelTrans.classList.add('hidden');isTransitioning=false;updateUI();startTimer();loadRound();
}
function endGame(won){
  isPlaying=false;stopFloat();stopTimer();bubbleField.innerHTML='';
  finalScore.textContent=score;let stars='',msg='',title='';
  if(won){title='🎉 恭喜通关！';stars='⭐⭐⭐';msg='太厉害了，所有关卡全部通过！🏆'}
  else{
    title='⏰ 游戏结束';const n=Math.floor(score/50);stars='⭐'.repeat(Math.min(n,3))||'';
    if(score>=100)msg='非常棒！继续挑战下一关吧！👍';else if(score>=60)msg='做得不错，再练练就能过关！💪';else msg='加油！多练习单词拼写！📖';
  }
  endTitle.textContent=title;resultStars.textContent=stars;endMessage.textContent=msg;
  endOverlay.classList.remove('hidden');
}

// ========== 词库编辑器 ==========
function openEditor(){
  if(isPlaying||isTransitioning){if(!confirm('编辑词库将中断当前游戏，确定吗？'))return}
  stopFloat();stopTimer();isPlaying=false;bubbleField.innerHTML='';
  // 加载当前词库到文本框
  const words = customWords || BUILTIN_WORDS;
  wordInput.value = words.map(w=>w.zh+'='+w.en).join('\n');
  editorPanel.classList.remove('hidden');
}
function closeEditor(){editorPanel.classList.add('hidden')}

function applyCustomWords(){
  const text = wordInput.value.trim();
  if(!text){alert('请至少输入一组词！');return}
  const parsed = parseWordsInput(text);
  if(parsed.length < 6){
    alert(`至少需要6组词才能游戏，当前仅 ${parsed.length} 组。`);
    return;
  }
  saveCustomWords(parsed);
  closeEditor();
  startGame(); // 自动开始游戏
}

function resetToBuiltin(){
  customWords = null;
  try{localStorage.removeItem('bubbleWords')}catch(e){}
  wordInput.value = BUILTIN_WORDS.map(w=>w.zh+'='+w.en).join('\n');
  alert('已恢复内置词库，点击"保存并应用"使用');
}

// ========== 事件绑定 ==========
document.addEventListener('DOMContentLoaded',()=>{
  loadCustomWords();
  $('startBtn').addEventListener('click',startGame);
  $('startBtn2').addEventListener('click',startGame);
  $('restartFromEndBtn').addEventListener('click',startGame);
  $('continueBtn').addEventListener('click',startNextLevel);
  $('editBtn').addEventListener('click',openEditor);
  $('saveWordsBtn').addEventListener('click',applyCustomWords);
  $('resetWordsBtn').addEventListener('click',resetToBuiltin);
  $('closeEditorBtn').addEventListener('click',closeEditor);
});
</script>
</body>
</html>
